<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Кабінет водія</title>
<!--
  Прототип к ТЗ-004 «Кабинет водителя». Один файл, без сборки и без внешних зависимостей:
  открывается с диска, из мессенджера или по ссылке. Данные тестовые и живут в памяти страницы,
  после перезагрузки всё возвращается к исходному.

  В файле три экрана, каждый — отдельный компонент: кабинет со списком отчётов (GipDriverCabinet),
  форма отчёта (GipDriverReport) и просмотр отчёта (GipReportView). Экраны вызывают друг друга:
  кабинет открывает форму и просмотр, те возвращаются в кабинет. Каждый компонент ничего не знает
  о странице — получает контейнер и параметры, поэтому его можно вызвать и из другого дизайна.
  Параметры описаны в комментарии перед каждым компонентом.
-->
<style>
:root {
  color-scheme: light only;
  --y: #FFD400; --y-press: #E6BF00; --y-soft: #FFF6BF; --y-edge: #C9A800;
  --k: #111111; --bg: #F3F3F0; --card: #FFFFFF; --text: #111111; --muted: #5F5F5A; --line: #CFCFC9;
  --err: #C62828; --err-bg: #FDECEC; --note: #F0F0EC;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.4 var(--font); }

.gdr { max-width: 480px; margin: 0 auto; padding: 0 0 32px; color: var(--text); }
.gdr-top { background: var(--k); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 5; }
.gdr-top h1 { margin: 0; font-size: 19px; font-weight: 700; color: var(--y); }
.gdr-top small { display: block; color: #FFFFFF; font-weight: 400; font-size: 13px; }
.gdr-hbtn { background: var(--k); color: var(--y); border: 1.5px solid var(--y); border-radius: 999px; padding: 8px 14px; font: 600 14px var(--font); min-height: 40px; }
.gdr-hbtn.on { background: var(--y); color: var(--k); }

.gdr-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 12px; padding: 14px 14px 2px; }
.gdr-card h2 { margin: 0 0 12px; font-size: 18px; color: var(--text); }
.gdr-empty { color: var(--muted); font-size: 15px; margin: 0 0 12px; }

.gdr-f { margin: 0 0 14px; }
.gdr-f > label { display: block; font-weight: 600; font-size: 15px; margin: 0 0 6px; color: var(--text); }
.gdr-req { color: var(--err); }
.gdr-in { display: block; width: 100%; max-width: 100%; min-width: 0; min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #FFFFFF; color: var(--text); font: 17px var(--font); }
.gdr-in:focus { outline: 3px solid var(--y); outline-offset: 1px; border-color: var(--k); }
.gdr-in.bad { border-color: var(--err); background: var(--err-bg); }
.gdr-in.num { text-align: right; }   /* числа — по правому краю, и введённые, и посчитанные */
.gdr-auto.num { flex-direction: row-reverse; }
.gdr-auto.num .src { text-align: left; }
textarea.gdr-in { min-height: 84px; resize: vertical; }
.gdr-file { font: 15px var(--font); color: var(--text); max-width: 100%; }

.gdr-auto { background: var(--y-soft); border: 1.5px dashed var(--y-edge); border-radius: 10px; padding: 10px 12px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; color: var(--text); }
.gdr-auto .src { font-weight: 400; font-size: 13px; color: var(--muted); text-align: right; }
.gdr-auto .ln { display: block; text-align: right; }
.gdr-auto .ln small { font-weight: 400; font-size: 13px; color: var(--muted); }

.gdr-seg { display: flex; gap: 8px; }
.gdr-seg label { flex: 1; margin: 0; position: relative; }
.gdr-seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.gdr-seg span { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1.5px solid var(--line); border-radius: 10px; background: #FFFFFF; color: var(--text); font-weight: 600; }
.gdr-seg input:checked + span { background: var(--k); color: var(--y); border-color: var(--k); }
.gdr-seg input:focus + span { outline: 3px solid var(--y); outline-offset: 1px; }
.gdr-seg.bad span { border-color: var(--err); }
/* вариантов больше двух или названия длинные — столбиком, с пояснением под названием */
.gdr-seg.col { flex-direction: column; }
.gdr-seg.col span { flex-direction: column; align-items: flex-start; padding: 8px 14px; min-height: 52px; }
.gdr-seg small { font-weight: 400; font-size: 13px; color: var(--muted); }
.gdr-seg input:checked + span small { color: #FFFFFF; }

/* Ошибка: красная рамка вокруг всего поля с подписью, восклицательный знак и жирный текст — не спутать и не пропустить */
.gdr-f { scroll-margin-top: 84px; }
.gdr-f.bad { background: var(--err-bg); border: 2px solid var(--err); border-radius: 12px; padding: 10px 10px 12px; margin-left: -8px; margin-right: -8px; }
.gdr-f.bad > label { color: var(--err); }
.gdr-f.flash { animation: gdr-flash .45s ease-in-out 3; }
@keyframes gdr-flash { 50% { box-shadow: 0 0 0 8px rgba(198, 40, 40, .45); } }
.gdr-err { display: none; color: var(--err); font-size: 15px; font-weight: 700; margin: 8px 0 0; }
.gdr-err.show { display: flex; align-items: center; gap: 8px; }
.gdr-err.show::before { content: '!'; flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--err); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; }
/* Полоса внизу экрана после неудачной отправки: видна всегда, говорит, сколько осталось и что дальше */
.gdr-bar { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 10; display: none; align-items: center; gap: 12px; padding: 12px 14px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--err); color: #FFFFFF; }
.gdr-bar.show { display: flex; }
.gdr-bar.ok { background: var(--k); }
.gdr-bar-t { flex: 1; min-width: 0; font-size: 14px; line-height: 1.3; color: #FFFFFF; }
.gdr-bar-t b { display: block; font-size: 16px; }
.gdr-bar-b { flex: none; min-height: 48px; padding: 0 16px; border: 0; border-radius: 10px; background: #FFFFFF; color: var(--err); font: 700 16px var(--font); }
.gdr-bar.ok .gdr-bar-b { background: var(--y); color: var(--k); }
.gdr.barred { padding-bottom: 120px; }
.gdr-hint, .gdr-note { display: none; font-size: 13px; line-height: 1.4; color: #2E2E2B; background: var(--note); border-left: 4px solid var(--k); border-radius: 4px; }
.gdr-hint { padding: 6px 8px; margin: 6px 0 0; }
.gdr-note { padding: 10px 12px; margin: 12px; }
.hints .gdr-hint, .hints .gdr-note { display: block; }

.gdr-btn { display: block; width: 100%; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--k); background: #FFFFFF; color: var(--k); font: 700 17px var(--font); }
.gdr-btn.primary { background: var(--y); }
.gdr-btn.primary:active { background: var(--y-press); }
.gdr-btn.ghost { border-style: dashed; }
.gdr-link { background: none; border: 0; color: var(--err); font: 600 15px var(--font); padding: 8px 0; min-height: 44px; }
.gdr-actions { margin: 12px; }

.gdr-refill { border: 1.5px solid var(--k); border-radius: 12px; padding: 8px 12px 0; margin: 0 0 12px; }
.gdr-refill-h { display: flex; justify-content: space-between; align-items: center; margin: 0 0 6px; font-weight: 700; color: var(--text); }
.gdr-photo { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; color: var(--text); font-size: 15px; }
.gdr-photo span { flex: 1; }
.gdr-2 { display: flex; gap: 8px; }
.gdr-2 > * { flex: 1; min-width: 0; }
/* литры: слева вид топлива, справа число */
.gdr-lit .gdr-fuel { flex: 0 0 40%; }
.gdr-auto.gdr-fuel { justify-content: center; }
/* кнопка-подпись поверх скрытого выбора файла: камера или галерея */
.gdr-shot { display: flex; align-items: center; justify-content: center; position: relative; min-height: 48px; padding: 6px 8px; font-size: 15px; text-align: center; }
.gdr-shot input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.gdr-photo img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.gdr-sum { background: var(--y-soft); border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; font-size: 15px; color: var(--text); }

.gdr-done { text-align: center; padding-top: 22px; }
.gdr-done .big { font-size: 22px; font-weight: 800; margin: 10px 0 4px; color: var(--text); }
.gdr-check { width: 64px; height: 64px; border-radius: 50%; background: var(--y); color: var(--k); display: inline-flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; }
.gdr-kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); text-align: left; font-size: 15px; color: var(--text); }
.gdr-kv span:last-child { font-weight: 700; text-align: right; }

/* поле-кнопка: открывает список с поиском */
.gdr-pick { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; }
.gdr-pick .ph { color: var(--muted); }
/* пиктограмма типа: машина, тягач, прицеп — цвет берёт у текста */
.gdr-ic { width: 34px; height: 20px; flex: none; fill: currentColor; }
.gdr-pick span:first-child, .gdr-opt span { display: flex; align-items: center; gap: 10px; }
.gdr-pick .chev { font-size: 22px; line-height: 1; color: var(--k); }
.gdr-sheet { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; z-index: 20; }
.gdr-search { padding: 12px 12px 0; }
.gdr-list { padding: 12px; }
.gdr-pad { margin: 12px 12px 0; }
.gdr-opt { display: flex; flex-direction: column; justify-content: center; width: 100%; min-height: 56px; margin: 0 0 8px; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: #FFFFFF; color: var(--text); font: 600 17px var(--font); text-align: left; }
.gdr-opt small { font-weight: 400; font-size: 13px; color: var(--muted); }
.gdr-opt.on { background: var(--k); color: var(--y); border-color: var(--k); }
.gdr-opt.on small { color: #FFFFFF; }
.gdr-lim { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.gdr-alt { display: block; background: none; border: 0; padding: 10px 0 0; min-height: 44px; color: var(--k); font: 600 15px var(--font); text-decoration: underline; text-align: left; }
.gdr-cap { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 4px 2px 8px; }

/* шапка с кнопкой «назад» — у экранов, вызванных из кабинета */
.gdr-top h1 { flex: 1; min-width: 0; }
.gdr-back { flex: none; width: 44px; height: 44px; padding: 0 0 4px; border: 1.5px solid var(--y); border-radius: 50%; background: var(--k); color: var(--y); font: 700 26px/1 var(--font); }
/* кабинет: разделы и строки списка отчётов */
.gdr-sec { margin: 18px 14px 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.gdr-sec.bad { color: var(--err); }
.gdr-row { display: block; width: calc(100% - 24px); margin: 0 12px 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #FFFFFF; color: var(--text); font: 17px/1.35 var(--font); text-align: left; }
.gdr-row > b { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.gdr-row small { display: block; margin-top: 3px; color: var(--muted); font-size: 14px; }
.gdr-row .gdr-meta { color: var(--text); font-size: 15px; }
.gdr-row .gdr-desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* вторая строка: слева дата, машина и пробег, справа под состоянием — номер отчёта */
.gdr-row .gdr-l2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 3px; }
.gdr-row .gdr-l2 small { margin-top: 0; }
.gdr-row .gdr-num { flex: none; font-size: 12px; }
.gdr-row p { margin: 10px 0 0; font-size: 15px; color: var(--text); }
.gdr-row.ret { border: 2px solid var(--err); background: var(--err-bg); }
.gdr-row.ret p b { color: var(--err); }
.gdr-row.draft { border: 1.5px dashed var(--k); }
.gdr-rowb { margin-top: 12px; }
.gdr-row .gdr-fail { color: var(--err); font-weight: 600; }
/* строка отчёта нажимается: она чуть приподнята, как кнопка, и «утапливается» под пальцем */
button.gdr-row { border-bottom: 2px solid #B4B4AD; box-shadow: 0 2px 5px rgba(0, 0, 0, .10); }
button.gdr-row:active { background: var(--y-soft); box-shadow: none; transform: translateY(1px); }
/* отчёт, помеченный офисом на удаление: виден, но приглушён */
.gdr-row.del > b span:first-child { color: var(--muted); text-decoration: line-through; }
.gdr-row.del .gdr-meta { color: var(--muted); }
.gdr-row p:first-child { margin-top: 0; }
/* кто вошёл и выход — в самом низу списка */
.gdr-acc { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 14px 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--text); font-size: 15px; }
.gdr-acc small { display: block; color: var(--muted); font-size: 13px; }
.gdr-acc .gdr-btn { width: auto; min-height: 44px; padding: 0 18px; font-size: 15px; }
.gdr-warn.bad { background: var(--err-bg); color: var(--err); }
.gdr-top + .gdr-row { margin-top: 12px; }
/* состояние отчёта: всегда значок и слово, не один цвет */
.gdr-st { display: inline-flex; align-items: center; gap: 4px; flex: none; padding: 2px 9px; border: 1.5px solid var(--line); border-radius: 999px; background: #FFFFFF; color: var(--text); font-size: 13px; font-weight: 700; white-space: nowrap; }
.gdr-st.st-approved { background: var(--k); border-color: var(--k); color: var(--y); }
.gdr-st.st-returned { background: var(--err); border-color: var(--err); color: #FFFFFF; }
.gdr-st.st-deleted { color: var(--muted); }
.gdr-kv small { display: block; font-weight: 400; color: var(--muted); }
/* вопрос перед отправкой: выезжает снизу, кнопки под большим пальцем */
.gdr-modal { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .6); }
.gdr-ask { width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; margin: 0; padding: 18px 16px 20px; border-radius: 16px 16px 0 0; }
.gdr-ask h2 { font-size: 21px; }
.gdr-ask .gdr-btn { margin-top: 10px; }
.gdr-warn { margin: 12px 0 4px; padding: 10px 12px; border-radius: 10px; background: var(--y-soft); color: var(--text); font-size: 15px; font-weight: 600; }
/* замечание офиса при исправлении: закреплено под шапкой, по нажатию раскрывается целиком */
.gdr-remark { position: sticky; top: 68px; z-index: 4; padding: 10px 14px; background: var(--err-bg); border-bottom: 2px solid var(--err); color: var(--text); font-size: 15px; }
.gdr-remark b { display: block; color: var(--err); }
.gdr-remark p { margin: 2px 0; max-height: 2.8em; overflow: hidden; }
.gdr-remark.open p { max-height: none; }
.gdr-remark small { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
'use strict';

/* ===================== 1. ТЕСТОВЫЕ ДАННЫЕ =====================
   Вымышленные. В системе их отдаёт сервер: машины — ТЗ-011, маршруты — ТЗ-003,
   виды топлива — ТЗ-012, настройки — ТЗ-001 п. 3.10, отчёты — ТЗ-007. */

function isoDate(d) { var p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function shift(iso, days) { var a = iso.split('-').map(Number); return isoDate(new Date(a[0], a[1] - 1, a[2] + days)); }

function testData(today) {
  var d = {
    driver: { name: 'Прототипов В. С.', email: 'prototypov@example.com' },   // выдуманный водитель: по фамилии видно, что это макет
    // backdateDays — на сколько дней назад можно сдать отчёт; historyDays — за сколько дней водитель видит свои отчёты
    settings: { backdateDays: 1, historyDays: 30 },
    fuelTypes: [{ id: 'dt', name: 'Дизель' }, { id: 'a95', name: 'Бензин А-95' }, { id: 'gas', name: 'Газ' }],
    vehicles: [
      // fuel — табличная часть «Топливо» (ТЗ-011, п. 3.3): не больше двух строк, у одной стоит main — основное топливо.
      // У каждого: fuelTypeId — вид, rate — норма, л на 100 км, tank — объём бака под это топливо, л: больше в бак залить нельзя.
      // Норма и объём необязательны: вид топлива известен раньше, чем посчитана норма. Не задан объём — проверки нет.
      // fuelSecondMode — как идёт второе топливо: 'instead' — вместо основного (бензин и газ: рейс идёт на одном из них),
      // 'together' — вместе с основным (газодизель: на каждом километре горят оба).
      // kind — тип, один выбор при заведении машины: 'van' — бус, 'truck' — грузовик, 'tractor' — тягач (ездит с прицепом),
      // 'trailer' — прицеп. От типа зависят пиктограмма и поле «Причіп»; прицеп как машина рейса не предлагается.
      // reefTank — объём бака рефа, л. Реф может стоять на любой машине и на прицепе; у тягача своего рефа нет.
      // Задан объём — реф заправляется отдельно, и в заправке появляется выбор «куда залито».
      { id: 'v1', name: 'АА 1001 ТС', kind: 'van', reefTank: 30, fuel: [{ fuelTypeId: 'dt', main: true, rate: 9.8, tank: 75 }] },   // бус с рефом, есть прошлый отчёт
      { id: 'v2', name: 'АА 1002 ТС', kind: 'van', fuel: [{ fuelTypeId: 'dt', main: true, rate: 10.5, tank: 93 }] },  // новая машина, отчётов нет
      { id: 'v3', name: 'АА 1003 ТС', kind: 'van' },                                                       // топливо в справочнике не задано
      { id: 'v4', name: 'АА 1004 ТС', kind: 'truck', reefTank: 60, fuel: [{ fuelTypeId: 'dt', main: true, rate: 17.5, tank: 120 }] },  // пятитонник с рефом
      { id: 'v5', name: 'АА 2001 ТС', kind: 'tractor', fuel: [{ fuelTypeId: 'dt', main: true, rate: 28.5, tank: 800 }] },
      { id: 'v6', name: 'АА 1005 ТС', kind: 'van', fuelSecondMode: 'instead',                              // бус на газу, бензин — вместо газа
        fuel: [{ fuelTypeId: 'a95', main: false, rate: 11, tank: 70 }, { fuelTypeId: 'gas', main: true, rate: 13.2, tank: 60 }] },   // основное — не первая строка
      { id: 'v7', name: 'АА 1006 ТС', kind: 'truck', fuelSecondMode: 'together',                           // газодизель: дизель и газ разом
        fuel: [{ fuelTypeId: 'dt', main: true, rate: 10, tank: 200 }, { fuelTypeId: 'gas', main: false, rate: 13.5, tank: 120 }] },
      { id: 't1', name: 'АА 3001 ХР', kind: 'trailer', reefTank: 240 },                                        // прицеп с рефом
      { id: 't2', name: 'АА 3002 ХР', kind: 'trailer' }                                                        // прицеп без рефа
    ],
    routes: [
      { id: 'r1', name: 'Київ — Львів', descRequired: false },
      { id: 'r2', name: 'Київ — Одеса', descRequired: false },
      { id: 'r3', name: 'Київ — Варшава', descRequired: false },
      { id: 'r4', name: 'Інше по Україні', descRequired: true },
      { id: 'r5', name: 'Перегін', descRequired: true },
      { id: 'r6', name: 'Дніпро — Київ', descRequired: false },
      { id: 'r7', name: 'Дніпро — Харків', descRequired: false }
    ],
    reports: [
      // mine — отчёт этого водителя. state — состояние по ТЗ-007: submitted, returned (с замечанием офиса), approved.

    ]
  };
  d.reports = d.reports.map(function (r) { return mkReport(d, r); });

}
// Топливо рейса: какие виды топлива машины считаются по норме. Одно топливо — оно; второе «вместо основного» —
// основное либо второе, если водитель сказал, что рейс шёл на нём (alt); второе «вместе с основным» — оба.
// Строки топлива машины: основное первым. Строка одна — она основная без отметки.
function fuelsOf(v) {
  var rows = (v && v.fuel) || [];
  return rows.length < 2 ? rows.slice() : rows.filter(function (x) { return x.main; }).concat(rows.filter(function (x) { return !x.main; }));
}
function tripFuels(v, alt) {
  var f = fuelsOf(v);
  if (!f.length) return [];
  if (f[1] && v.fuelSecondMode === 'together') return [f[0], f[1]];
  return [(f[1] && v.fuelSecondMode === 'instead' && alt) ? f[1] : f[0]];
}
function consOf(mileage, rate) { return (mileage != null && rate) ? Math.round(mileage * rate / 10) / 10 : null; }
// Норма и расчётный расход ложатся в отчёт по топливу: fuelTypeId/norm/cons — первое, fuel2TypeId/norm2/cons2 — второе, если горят оба.
function putFuel(r, fuels) {
  var a = fuels[0], b = fuels[1];
  r.fuelTypeId = a ? a.fuelTypeId : ''; r.norm = a && a.rate ? a.rate : null; r.cons = consOf(r.mileage, r.norm);
  r.fuel2TypeId = b ? b.fuelTypeId : ''; r.norm2 = b && b.rate ? b.rate : null; r.cons2 = b ? consOf(r.mileage, r.norm2) : null;
}
// Доводит тестовый отчёт до того вида, в каком отчёт создаёт форма: названия, пробег, норма, расчётный расход, итоги.
function mkReport(d, r) {
  var v = byId(d.vehicles, r.vehicleId), t = byId(d.vehicles, r.trailerId);
  r.vehicleName = v.name;
  r.trailerId = r.trailerId || (v.kind === 'tractor' ? 'none' : '');
  r.trailerName = t ? t.name : '';
  r.routeName = byId(d.routes, r.routeId).name;
  r.routeDesc = r.routeDesc || ''; r.comment = ''; r.departed = ''; r.arrived = '';
  r.odoPrev = r.odoPrev == null ? null : r.odoPrev;
  r.mileage = r.odoEnd - r.odoStart;
  putFuel(r, tripFuels(v, r.altFuel));
  r.refills = r.refills || []; r.tank = 0; r.reef = 0; r.sum = 0;   // sum — оплачено не топливной картой
  r.refills.forEach(function (x) {
    if (x.target === 'reef') r.reef += x.liters; else r.tank += x.liters;
    if (x.sum) r.sum += x.sum;
  });
  return r;
}

/* ===================== 2. ОБЩЕЕ ДЛЯ ВСЕХ ЭКРАНОВ ===================== */

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nf(n, min, max) { return Number(n).toLocaleString('uk-UA', { minimumFractionDigits: min, maximumFractionDigits: max }); }
function fmtDate(iso) { return iso.split('-').reverse().join('.'); }
// Название посреди строки — со строчной буквы, остальное как в справочнике: «бензин А-95», а не «бензин а-95».
function low(s) { s = String(s == null ? '' : s); return s.charAt(0).toLowerCase() + s.slice(1); }
function byId(list, id) { return list.filter(function (x) { return x.id === id; })[0] || null; }
// В списке дата короткая, без года: там отчёты за последний месяц. Для сегодня и вчера рядом ещё и слово.
function shortDay(iso, today) {
  var p = iso.split('-'), s = p[2] + '.' + p[1];
  return iso === today ? 'сьогодні, ' + s : (iso === shift(today, -1) ? 'вчора, ' + s : s);
}function kv(a, b) { return '<div class="gdr-kv"><span>' + a + '</span><span>' + b + '</span></div>'; }
// Число для поля ввода: пробел между тысячами, дробная часть через запятую.
function grp(n) { var s = String(n).split('.'); return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (s[1] ? ',' + s[1] : ''); }

var TYPE = { barrel: 'з бочки', card: 'паливна картка', bank: 'банківська картка', cash: 'готівка' };
// Состояние отчёта — всегда значок и слово, не один цвет.
var STATE = { submitted: ['○', 'Відправлений'], returned: ['↩', 'На виправленні'], approved: ['✓', 'Підтверджений'] };
function badge(r) {
  var s = r.deleted ? ['⊘', 'Позначено на видалення'] : (STATE[r.state] || STATE.submitted);
  return '<span class="gdr-st st-' + (r.deleted ? 'deleted' : r.state) + '">' + s[0] + ' ' + s[1] + '</span>';
}
// Шапка экрана: кнопка «назад» есть у экранов, которые вызваны из другого экрана.
function topbar(title, sub, o) {
  return '<div class="gdr-top">' + (o.back ? '<button type="button" class="gdr-back" data-act="back" aria-label="Назад">‹</button>' : '') +
    '<h1>' + title + '<small>' + sub + '</small></h1>' +
    '<button type="button" class="gdr-hbtn' + (o.hints ? ' on' : '') + '" data-act="hints">Пояснення</button></div>';
}
function remarkHtml(r) {
  return '<p><b>Зауваження офісу.</b> ' + esc(r.remark) + '</p><small>' + esc(r.returnedBy || '') + (r.returnedAt ? ' · ' + fmtDate(r.returnedAt) : '') + '</small>';
}
// Отчёт строками «название — значение»: один и тот же вид после отправки и при просмотре из списка.
function reportDetails(r, data) {
  var h = kv('Дата рейсу', fmtDate(r.date)) + kv('Автомобіль', esc(r.vehicleName));
  if (r.trailerId) h += kv('Причіп', r.trailerId === 'none' ? 'без причепа' : esc(r.trailerName));
  h += kv('Маршрут', esc(r.routeName) + (r.routeDesc ? '<small>' + esc(r.routeDesc) + '</small>' : ''));
  h += kv('Спідометр', nf(r.odoStart, 0, 0) + ' → ' + nf(r.odoEnd, 0, 0));
  if (r.odoPrev != null && r.odoPrev !== r.odoStart) {
    h += kv('Розбіжність на початок', (r.odoStart > r.odoPrev ? '+' : '−') + nf(Math.abs(r.odoStart - r.odoPrev), 0, 0) + ' км<small>за попереднім звітом ' + nf(r.odoPrev, 0, 0) + '</small>');
  }
  h += kv('Пробіг', nf(r.mileage, 0, 0) + ' км');
  // По каждому топливу рейса: расход, вид и норма. Горят оба (газодизель) — две строки.
  h += kv('Розрахункова витрата', !r.fuelTypeId ? 'немає норми' : [[r.fuelTypeId, r.norm, r.cons]].concat(r.fuel2TypeId ? [[r.fuel2TypeId, r.norm2, r.cons2]] : [])
    .map(function (x) {
      var fuel = byId(data.fuelTypes, x[0]);
      return (x[2] != null ? nf(x[2], 1, 1) + ' л' : 'немає норми') + '<small>' + (fuel ? esc(low(fuel.name)) : '') + (x[1] ? ', норма ' + nf(x[1], 1, 2) : '') + '</small>';
    }).join(''));
  if (!r.refills.length) h += kv('Заправки', 'не було');
  r.refills.forEach(function (x, i) {
    var fuel = byId(data.fuelTypes, x.fuelTypeId);
    h += kv('Заправка ' + (i + 1), nf(x.liters, 0, 2) + ' л' + (x.target === 'reef' ? ' у реф' : ' у бак') + '<small>' +
      [fuel ? esc(low(fuel.name)) : '', TYPE[x.type], x.target === 'reef' ? '' : 'спідометр ' + nf(x.odo, 0, 0), x.target === 'reef' ? '' : (x.full ? 'до повного' : 'не до повного'),
        x.sum ? nf(x.sum, 2, 2) + ' грн' : '', x.hasPhoto ? 'є фото чека' : ''].filter(Boolean).join(' · ') + '</small>');
  });
  if (r.sum) h += kv('Оплачено не паливною карткою', nf(r.sum, 2, 2) + ' грн');
  if (r.departed || r.arrived) h += kv('Виїзд — прибуття', esc(String(r.departed).replace('T', ' ')) + ' — ' + esc(String(r.arrived).replace('T', ' ')));
  if (r.comment) h += kv('Коментар', esc(r.comment));
  return h + kv('Номер звіту', r.number);   // номер — в самом конце: он нужен, только чтобы назвать отчёт офису
}

      var s = st.sheet, c = pickCfg(s.key), cur = st.f[s.key], found = 0, pins = 0, rest = 0, h = '';
      c.items.forEach(function (i) {
        var fixed = !!i.fixed, pin = !fixed && c.pinned(i), stick = fixed || (pin && c.sticky);
        if (s.q && !stick && !matches(i.name, s.q)) return;
        if (!stick) found++;
        if (c.caps && pin && !pins) h += '<div class="gdr-cap">' + c.caps[0] + '</div>';
        if (c.caps && !pin && !fixed && pins && !rest) h += '<div class="gdr-cap">' + c.caps[1] + '</div>';
        if (pin) pins++; else if (!fixed) rest++;
        h += '<button type="button" class="gdr-opt' + (i.id === cur ? ' on' : '') + '" data-act="choose" data-id="' + i.id + '"><span>' + (c.icon ? c.icon(i) : '') + esc(i.name) + '</span>' +
          (c.sub(i) ? '<small>' + c.sub(i) + '</small>' : '') + '</button>';
      });
      if (!found && s.q) h += '<p class="gdr-empty">' + c.empty + '</p>';
      return h;
    }
    function sheetView() {
      var s = st.sheet, c;
      if (!s) return '';
      c = pickCfg(s.key);
      return '<div class="gdr-sheet"><div class="gdr-top"><h1>' + c.title + '</h1><button type="button" class="gdr-hbtn" data-act="close">Закрити</button></div>' +
        '<div class="gdr-search"><input class="gdr-in" type="search" data-q="1" placeholder="' + c.ph + '" autocomplete="off" value="' + esc(s.q) + '"></div>' +
        '<div class="gdr-hint gdr-pad">' + c.hint + '</div><div class="gdr-list" data-out="picklist">' + pickList() + '</div></div>';
    }
    // Дата — выпадающий список разрешённых дней: сегодня и назад на глубину настройки. Руками не вводится.
    function dateText(d) {
      return fmtDate(d) + (d === today ? ' · сьогодні' : (d === shift(today, -1) ? ' · вчора' : ''));
    }
    function dateSel() {
      var list = [], i;
      for (i = 0; i <= data.settings.backdateDays; i++) list.push(shift(today, -i));
      // При исправлении дата самого отчёта остаётся в списке, даже если она уже старше разрешённой глубины.
      if (P.report && list.indexOf(P.report.date) < 0) list.push(P.report.date);
      return '<select class="gdr-in" id="f-date" data-f="date">' + list.map(function (d) {
        return '<option value="' + d + '"' + (d === st.f.date ? ' selected' : '') + '>' + dateText(d) + '</option>';
      }).join('') + '</select>';
    }

    function head() {
      if (P.embed) return '';
      if (P.report) return topbar('Виправлення', esc(P.report.routeName) + ' · ' + fmtDate(P.report.date), { back: !!P.onExit, hints: st.hints });
      return topbar(P.onExit ? 'Новий звіт' : 'Звіт водія', esc(data.driver.name), { back: !!P.onExit, hints: st.hints });
    }

    // Фото чека. «Сфотографувати» сразу открывает заднюю камеру телефона (capture), «З галереї» — готовые снимки.
    // Камера системная, через выбор файла: ей не нужны разрешения страницы, и она работает в файле, открытом из мессенджера.
    function photoView(r) {
      var shot = function (text, capture) {
        return '<label class="gdr-btn gdr-shot">' + text + '<input type="file" accept="image/*"' + (capture ? ' capture="environment"' : '') + ' data-photo="' + r.id + '"></label>';
      };
      // 'kept' — фото приложено раньше, отчёт вернули на исправление: самого снимка в форме нет, он уже в системе.
      return (r.photo ? '<div class="gdr-photo">' + (r.photo === 'kept' ? '<span>Фото додано раніше</span>' : '<img src="' + r.photo + '" alt=""><span>Фото додано</span>') +
          '<button type="button" class="gdr-link" data-act="delphoto" data-id="' + r.id + '">Прибрати</button></div>' : '') +
        '<div class="gdr-2">' + shot(r.photo ? 'Перезняти' : 'Сфотографувати', true) + shot('З галереї', false) + '</div>';
    }

    function refillView(r, i) {
      var k = 'r' + r.id + '.', v = vehicle(), af = autoFuel(), fuel;
      var h = '<div class="gdr-refill"><div class="gdr-refill-h"><span>Заправка ' + (i + 1) + '</span>' +
        '<button type="button" class="gdr-link" data-act="del" data-id="' + r.id + '">Видалити</button></div>';
      h += fld(k + 'type', 'Спосіб заправки', seg(k + 'type', [['barrel', 'З бочки', 'наше пальне, без оплати'], ['card', 'Паливна картка', 'картка, яку видала компанія'],
        ['bank', 'Банківська картка'], ['cash', 'Готівка']], r.type, true), { req: 1, hint: H.rType });
      if (hasReef()) h += fld(k + 'target', 'Куди залито', seg(k + 'target', [['tank', 'У бак'], ['reef', 'У реф']], r.target), { req: 1, hint: H.rTarget });
      // Порядок после способа заправки: литры, «до полного», спидометр.
      // Вид топлива стоит слева от литров, своего поля у него нет: топливо у машины одно — система берёт его оттуда;
      // два — там же выбор из этих двух; не задано — выбор из всего справочника. Пока машина не выбрана, слева пусто.
      fuel = !v ? '' : (af ? '<div class="gdr-auto gdr-fuel">' + esc(fuelName(af)) + '</div>'
        : '<div class="gdr-fuel">' + sel(k + 'fuelTypeId', fuelOptions(), r.fuelTypeId, '— вид —') + '</div>');
      h += fld(k + 'liters', 'Літри', '<div class="gdr-2 gdr-lit">' + fuel + inp(k + 'liters', { mode: 'decimal', value: r.liters, ph: 'Наприклад, 45,5' }) + '</div>',
        { req: 1, forId: 'f-' + k + 'liters', hint: H.rLiters, note: limitNote(r), after: (v && !af) ? '<div class="gdr-err" data-err="' + k + 'fuelTypeId"></div>' : '' });
      if (target(r) === 'tank') {
        h += fld(k + 'full', 'Залито до повного бака?', seg(k + 'full', [['yes', 'Так'], ['no', 'Ні']], r.full), { req: 1, hint: H.rFull });
        h += fld(k + 'odo', 'Спідометр під час заправки, км', inp(k + 'odo', { mode: 'numeric', value: r.odo }), { req: 1, forId: 'f-' + k + 'odo', hint: H.rOdo, note: rangeText(), noteOut: 'range' });
      }
      // Сумма — только там, где платил водитель: банковская карта и наличные. По топливной карте её даёт выписка топливной компании.
      if (own(r)) h += fld(k + 'sum', 'Сума з чека, грн', inp(k + 'sum', { mode: 'decimal', value: r.sum }), { forId: 'f-' + k + 'sum', hint: H.rSum });
      if (paid(r)) h += fld(k + 'photo', 'Фото чека', photoView(r), { req: own(r) ? 1 : 0, hint: H.rPhoto });
      return h + '</div>';
    }

    function doneView() {
      var r = st.done;
      return '<div class="gdr-card gdr-done"><div class="gdr-check">✓</div><div class="big">' + (P.report ? 'Звіт відправлено знову' : 'Звіт відправлено') + '</div>' +
        '<p class="gdr-empty">Офіс перевірить його і підтвердить або поверне із зауваженням.</p>' + reportDetails(r, data) + '</div>' +
        '<div class="gdr-note">' + (P.report ? 'Исправленный отчёт — тот же, с тем же номером: он вернулся в состояние «Отправлен» и снова ждёт проверки (ТЗ-007, п. 3.7).'
          : 'Отчёт сразу попадает в систему в состоянии «Отправлен» (ТЗ-007). Он стал предыдущим для машины ' + esc(r.vehicleName) +
            ': в следующем отчёте по ней спидометр на начало будет ' + nf(r.odoEnd, 0, 0) + '.') + '</div>' +
        '<div class="gdr-actions">' + (P.onExit ? '<button type="button" class="gdr-btn primary" data-act="back">До моїх звітів</button>'
          : '<button type="button" class="gdr-btn primary" data-act="new">Новий звіт</button>') + '</div>';
    }

    function render() {
      el.classList.add('gdr');
      el.classList.toggle('hints', st.hints);
      st.editing = null;   // экран перерисован — набор в поле прерван
      document.body.style.overflow = (st.sheet || st.ask || st.fail) ? 'hidden' : '';   // под открытым списком или окном форма не прокручивается
      if (st.done) { el.classList.remove('barred'); el.innerHTML = head() + doneView(); return; }

      var f = st.f, v = vehicle(), p = prevReport(), rt = route(), u = used();
      var h = head();
      // Исправление: замечание офиса закреплено под шапкой, чтобы оно было перед глазами, пока водитель правит.
      if (P.report && P.report.remark) {
        h += '<div class="gdr-remark' + (st.remarkOpen ? ' open' : '') + '" data-act="remark"><b>Зауваження офісу</b><p>' + esc(P.report.remark) + '</p>' +
          '<small>' + esc(P.report.returnedBy || '') + (P.report.returnedAt ? ' · ' + fmtDate(P.report.returnedAt) : '') + ' · натисніть, щоб ' + (st.remarkOpen ? 'згорнути' : 'розгорнути') + '</small></div>';
      }
      h += '<div class="gdr-note">' + H.legend + '</div>';

      h += '<div class="gdr-card"><h2>Рейс</h2>';
      h += fld('date', 'Дата рейсу', dateSel(), { req: 1, forId: 'f-date', hint: H.date });
      h += fld('vehicleId', 'Автомобіль', pickBtn('vehicleId', v ? unitIcon(v) + esc(v.name) + (v.kind === 'tractor' ? ' · тягач' : '') : '', 'pick', '— оберіть автомобіль —'), { req: 1, forId: 'f-vehicleId', hint: H.vehicle });
      if (v && v.kind === 'tractor') {
        h += fld('trailerId', 'Причіп', pickBtn('trailerId', f.trailerId === 'none' ? 'Без причепа' : (trailer() ? unitIcon(trailer()) + esc(trailer().name) : ''), 'pick', '— оберіть причіп —'),
          { req: 1, forId: 'f-trailerId', hint: H.trailer });
      }
      h += fld('routeId', 'Маршрут', pickBtn('routeId', rt ? esc(rt.name) : '', 'pick', '— оберіть маршрут —'), { req: 1, forId: 'f-routeId', hint: H.route });
      if (rt && rt.descRequired) {
        h += fld('routeDesc', 'Опис маршруту', '<textarea class="gdr-in" id="f-routeDesc" data-f="routeDesc" placeholder="Куди їздили">' + esc(f.routeDesc) + '</textarea>', { req: 1, forId: 'f-routeDesc', hint: H.routeDesc });
      }
      h += '</div>';

      h += '<div class="gdr-card"><h2>Спідометр і пальне</h2>';
      if (!v) h += fld('odoStart', 'Спідометр на початок рейсу, км', auto('', '—', 'оберіть автомобіль', true), { hint: H.odoStart });
      else if (p && !f.odoOverride) h += fld('odoStart', 'Спідометр на початок рейсу, км', auto('', nf(p.odoEnd, 0, 0), 'зі звіту № ' + p.number + ' від ' + fmtDate(p.date), true),
        { hint: H.odoStart, after: '<button type="button" class="gdr-alt" data-act="ovr">На спідометрі інший показник</button>' });
      else if (p) h += fld('odoStart', 'Спідометр на початок рейсу, км', inp('odoStart', { mode: 'numeric', value: f.odoStart, ph: 'Показник на спідометрі' }),
        { req: 1, forId: 'f-odoStart', hint: H.odoStart, note: 'За звітом № ' + p.number + ' від ' + fmtDate(p.date) + ' — ' + nf(p.odoEnd, 0, 0),
          after: '<div class="gdr-lim" data-out="gap"></div><button type="button" class="gdr-alt" data-act="ovr">Повернути показник із попереднього звіту</button>' });
      else h += fld('odoStart', 'Спідометр на початок рейсу, км', inp('odoStart', { mode: 'numeric', value: f.odoStart, ph: 'Попереднього звіту немає' }), { req: 1, forId: 'f-odoStart', hint: H.odoStartManual });
      h += fld('odoEnd', 'Спідометр на кінець рейсу, км', inp('odoEnd', { mode: 'numeric', value: f.odoEnd, ph: 'Повний показник' }), { req: 1, forId: 'f-odoEnd', hint: H.odoEnd });
      h += fld('mileage', 'Пробіг, км', auto('mileage', '—', '', true), { hint: H.mileage });
      // Пальне в рейсі — только у машины, где второе топливо идёт вместо основного (instead). Подставлено основное;
      // водитель меняет его кнопкой, как спидометр на начало, и так же может вернуть.
      if (altVehicle()) {
        h += fld('altFuel', 'Пальне в рейсі', auto('', esc(fuelName(u[0].fuelTypeId)), f.altFuel ? 'замість основного' : 'основне пальне'),
          { hint: H.tripFuel, after: '<button type="button" class="gdr-alt" data-act="altfuel">' +
            (f.altFuel ? 'Повернути основне: ' + esc(fuelName(fuelsOf(v)[0].fuelTypeId)) : 'Інше пальне: ' + esc(fuelName(fuelsOf(v)[1].fuelTypeId))) + '</button>' });
      }
      h += fld('norm', 'Норма витрати, л на 100 км', normBox(v, u), { hint: H.norm });
      h += fld('cons', 'Розрахункова витрата, л', auto('cons', '—', '', true), { hint: H.cons });
      h += '</div>';

      h += '<div class="gdr-card"><h2>Заправки</h2>';
      if (!st.refills.length) h += '<p class="gdr-empty">Якщо заправок не було, нічого не додавайте.</p>';
      st.refills.forEach(function (r, i) { h += refillView(r, i); });
      h += '<div class="gdr-sum" data-out="totals" style="display:none"></div>';
      h += '<div class="gdr-f"><button type="button" class="gdr-btn ghost" data-act="add">+ Додати заправку</button><div class="gdr-hint">' + H.refills + '</div></div>';
      h += '</div>';

      h += '<div class="gdr-card"><h2>Додатково</h2>';
      h += fld('departed', 'Виїзд', inp('departed', { type: 'datetime-local', value: f.departed }), { forId: 'f-departed', hint: H.times });
      h += fld('arrived', 'Прибуття', inp('arrived', { type: 'datetime-local', value: f.arrived }), { forId: 'f-arrived' });
      h += fld('comment', 'Коментар', '<textarea class="gdr-in" id="f-comment" data-f="comment">' + esc(f.comment) + '</textarea>', { forId: 'f-comment', hint: H.comment });
      h += '</div>';

      h += '<div class="gdr-actions"><button type="button" class="gdr-btn primary" data-act="submit">' + (P.report ? 'Відправити знову' : 'Відправити звіт') + '</button></div>';
      h += '<div class="gdr-bar" data-out="bar"></div>';
      el.innerHTML = h + sheetView() + (st.ask ? askView() : '') + (st.fail ? failView() : '');
      refresh();
    }

    // Два топлива рейса (газодизель) — по строке на каждое: число и вид.
    function lines(list) {
      return list.map(function (x) { return '<span class="ln">' + x[0] + ' <small>' + esc(low(fuelName(x[1]))) + '</small></span>'; }).join('');
    }
    function normBox(v, u) {
      if (!v) return auto('', '—', '', true);
      if (!u.length) return auto('', 'не задано', 'з довідника машин', true);
      if (u.length === 1) return auto('', u[0].rate ? nf(u[0].rate, 1, 2) : 'не задано', esc(fuelName(u[0].fuelTypeId)) + ' · з довідника машин', true);
      return auto('', lines(u.map(function (x) { return [x.rate ? nf(x.rate, 1, 2) : 'не задано', x.fuelTypeId]; })), 'обидва види разом · з довідника машин', true);
    }
    function consText(c) {
      if (!vehicle() || c.mileage == null) return '—';
      if (!c.cons.length) return 'немає норми';
      if (c.cons.length === 1) return c.cons[0].cons != null ? nf(c.cons[0].cons, 1, 1) : 'немає норми';
      return lines(c.cons.map(function (x) { return [x.cons != null ? nf(x.cons, 1, 1) : 'немає норми', x.fuelTypeId]; }));
    }
    function setOut(name, html) { var n = el.querySelector('[data-out="' + name + '"]'); if (n) n.innerHTML = html; return n; }

    function refresh() {
      if (st.done) return;
      var c = calc(), t;
      setOut('mileage', c.mileage != null ? nf(c.mileage, 0, 0) : '—');
      setOut('cons', consText(c));
      t = setOut('totals', 'Разом за рейс: у бак — <b>' + nf(c.tank, 0, 2) + ' л</b>' +
        (c.reef ? ', у реф — <b>' + nf(c.reef, 0, 2) + ' л</b>' : '') + (c.sum ? ', оплачено не паливною карткою — <b>' + nf(c.sum, 2, 2) + ' грн</b>' : ''));
      setOut('gap', gapText());
      if (t) t.style.display = st.refills.length ? '' : 'none';
      Array.prototype.forEach.call(el.querySelectorAll('[data-out="range"]'), function (n) { n.textContent = rangeText(); });
      // Идёт набор — новых ошибок не считаем, а с поля, которое правят, прежнюю снимаем.
      if (st.editing) delete st.shown[st.editing]; else st.shown = currentErrors();
      paintErrors(st.shown);
      // Всё, что водитель успел ввести, сразу отдаётся наружу: кабинет хранит это как незаконченный отчёт.
      if (st.dirty && typeof P.onDraft === 'function') P.onDraft(snapshot());
    }

    function errLabel(k) {
      var m = /^r(\d+)\.(\w+)$/.exec(k), i;
      if (!m) return LABEL[k] || k;
      for (i = 0; i < st.refills.length; i++) if (st.refills[i].id === Number(m[1])) break;
      return 'заправка ' + (i + 1) + ', ' + (LABEL[m[2]] || m[2]);
    }
    // Показать первую оставшуюся ошибку: поле в центр экрана, рамка мигает; по кнопке — ещё и курсор в поле.
    function showErr(focus) {
      var k = st.errKeys && st.errKeys[0], n = k && el.querySelector('[data-err="' + k + '"]'), box, inp;
      if (!n) return;
      box = n.parentNode;
      if (box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
      inp = focus && box.querySelector('input.gdr-in, textarea.gdr-in');
      if (inp) { try { inp.focus({ preventScroll: true }); } catch (x) { /* старый браузер: без курсора */ } }
    }
    function paintErrors(e) {
      var keys = [], bar = el.querySelector('[data-out="bar"]');
      // В одном блоке может быть две проверки (литры и вид топлива): рамка горит, если не прошла хотя бы одна.
      Array.prototype.forEach.call(el.querySelectorAll('.gdr-f.bad'), function (b) { b.classList.remove('bad'); });
      Array.prototype.forEach.call(el.querySelectorAll('[data-err]'), function (n) {
        var k = n.getAttribute('data-err'), m = e[k];
        n.textContent = m || '';
        n.classList.toggle('show', !!m);
        if (m) { n.parentNode.classList.add('bad'); keys.push(k); }
      });
      st.errKeys = keys;   // в порядке, в каком поля идут на экране
      Array.prototype.forEach.call(el.querySelectorAll('[data-f]'), function (n) {
        if (n.type !== 'radio') n.classList.toggle('bad', !!e[n.getAttribute('data-f')]);
      });
      Array.prototype.forEach.call(el.querySelectorAll('[data-seg]'), function (n) {
        n.classList.toggle('bad', !!e[n.getAttribute('data-seg')]);
      });
      // После неудачной отправки внизу экрана остаётся полоса: сколько осталось и какое поле следующее.
      // Всё исправлено — она же становится кнопкой отправки, листать вниз не нужно.
      if (bar) {
        bar.className = 'gdr-bar' + (st.tried ? ' show' : '') + (keys.length ? '' : ' ok');
        bar.innerHTML = keys.length
          ? '<div class="gdr-bar-t"><b>Звіт не відправлено</b>Залишилось виправити: ' + keys.length + '. Далі — ' + esc(errLabel(keys[0])) + '</div>' +
            '<button type="button" class="gdr-bar-b" data-act="showerr">Показати</button>'
          : '<div class="gdr-bar-t"><b>Усе заповнено</b>Можна відправляти</div><button type="button" class="gdr-bar-b" data-act="submit">Відправити</button>';
      }
      el.classList.toggle('barred', st.tried);
    }

    /* ---------- действия ---------- */
    function refillById(id) { return st.refills.filter(function (r) { return r.id === Number(id); })[0] || null; }

    function setVal(k, v) {
      var m = /^r(\d+)\.(\w+)$/.exec(k), r;
      if (m) { r = refillById(m[1]); if (r) r[m[2]] = v; } else st.f[k] = v;
    }
    // Смена машины, типа и места заправки меняет состав полей: лишнее очищается, чтобы не уехало в отчёт.
    function structural(k) {
      var m = /^r(\d+)\.(type|target)$/.exec(k), r;
      if (k === 'vehicleId') { st.f.odoStart = ''; st.f.odoOverride = false; st.f.altFuel = false; st.f.trailerId = ''; st.refills.forEach(function (x) { x.fuelTypeId = ''; x.target = ''; }); }
      if (k === 'trailerId') st.refills.forEach(function (x) { x.target = ''; });   // с другим прицепом реф мог появиться или пропасть
      if (k === 'routeId' && !(route() && route().descRequired)) st.f.routeDesc = '';
      if (m) {
        r = refillById(m[1]);
        if (r && !own(r)) r.sum = '';
        if (r && !paid(r)) r.photo = null;
        if (r && target(r) !== 'tank') { r.odo = ''; r.full = ''; }
      }
    }

    // «Відправити»: сначала проверка. Всё заполнено — вопрос с главными цифрами рейса, и только после «Так» отчёт уходит:
    // отправленный отчёт водитель изменить уже не сможет.
    function submit() {
      var e;
      st.tried = true;
      e = validate();
      st.editing = null;
      if (Object.keys(e).length) { st.shown = e; paintErrors(e); showErr(false); return; }
      st.ask = true;
      render();
    }
    function askView() {
      var c = calc(), v = vehicle(), t = trailer(), n = st.refills.length;
      return '<div class="gdr-modal"><div class="gdr-card gdr-ask"><h2>' + (P.report ? 'Відправити звіт знову?' : 'Відправити звіт?') + '</h2>' +
        '<p class="gdr-empty">Перевірте головне:</p>' +
        kv('Автомобіль', esc(v.name) + (t ? '<small>причіп ' + esc(t.name) + '</small>' : '')) + kv('Маршрут', esc(route().name)) +
        kv('Спідометр', nf(c.odoStart, 0, 0) + ' → ' + nf(int(st.f.odoEnd), 0, 0)) + kv('Пробіг', nf(c.mileage, 0, 0) + ' км') +
        kv('Заправки', n ? n + ' · ' + nf(c.tank + c.reef, 0, 2) + ' л' : 'не було') +
        '<p class="gdr-warn">Після відправки змінити звіт не можна. Виправити його вдасться, тільки якщо офіс поверне звіт вам.</p>' +
        '<div class="gdr-hint">Вопрос перед отправкой: после неё водитель отчёт не изменит. В окне главные цифры рейса, чтобы «Так» не нажимали не глядя.</div>' +
        '<button type="button" class="gdr-btn primary" data-act="send">Так, відправити</button>' +
        '<button type="button" class="gdr-btn" data-act="unask">Ні, ще перевірю</button></div></div>';
    }
    function failView() {
      return '<div class="gdr-modal"><div class="gdr-card gdr-ask"><h2>Немає зв\'язку</h2><p class="gdr-warn bad">Звіт не відправлено.</p>' +
        '<p class="gdr-empty">Він збережений на цьому телефоні й нікуди не зникне. Коли з\'явиться зв\'язок, натисніть «Повторити».</p>' +
        '<div class="gdr-hint">' + H.offline + '</div>' +
        '<button type="button" class="gdr-btn primary" data-act="send">Повторити</button>' +
        '<button type="button" class="gdr-btn" data-act="unfail">Закрити</button></div></div>';
    }
    function send() {
      var c, v, n, p, num, report;
      st.ask = false; st.fail = false;
      if (Object.keys(validate()).length) { render(); return; }
      // Нет связи — отчёт не уходит и не теряется: остаётся незаконченным на телефоне, отправку водитель повторяет сам.
      // P.offline — имитация для показа: первая попытка не проходит, повторная проходит.
      if ((P.offline && !st.retried) || (typeof navigator !== 'undefined' && navigator.onLine === false)) {
        st.retried = true; st.failed = true; st.dirty = true; st.fail = true;
        render();
        return;
      }
      c = calc(); v = vehicle(); n = autoFuel(); p = prevReport();
      num = data.reports.reduce(function (m, r) { return Math.max(m, Number(r.number)); }, 0) + 1;
      report = {
        number: P.report ? P.report.number : String(num).padStart(6, '0'), state: 'submitted', mine: true, date: st.f.date,
        vehicleId: v.id, vehicleName: v.name,
        trailerId: v.kind === 'tractor' ? st.f.trailerId : '', trailerName: (v.kind === 'tractor' && trailer()) ? trailer().name : '',
        routeId: st.f.routeId, routeName: route().name, routeDesc: st.f.routeDesc.trim(),
        odoStart: c.odoStart, odoPrev: p ? p.odoEnd : null,   // хранятся обе цифры: фактическая и из предыдущего отчёта
        odoEnd: int(st.f.odoEnd), mileage: c.mileage, altFuel: altVehicle() && st.f.altFuel,
        departed: st.f.departed, arrived: st.f.arrived, comment: st.f.comment.trim(),
        refills: st.refills.map(function (r) {
          var t = target(r);
          return { type: r.type, target: t, liters: dec(r.liters), fuelTypeId: n || r.fuelTypeId,
            odo: t === 'tank' ? int(r.odo) : null, full: t === 'tank' ? r.full === 'yes' : null,
            sum: (own(r) && r.sum !== '') ? dec(r.sum) : null, hasPhoto: !!r.photo };
        }),
        tank: c.tank, reef: c.reef, sum: c.sum
      };
      putFuel(report, used());   // норма копируется в отчёт числом — по каждому топливу рейса
      // Новый отчёт встаёт в общий ряд и становится предыдущим для своей машины. Исправленный — тот же отчёт с тем же
      // номером: он возвращается в «Відправлений», а последнее замечание офиса система помнит (ТЗ-007, п. 3.5).
      if (P.report) st.done = Object.assign(P.report, report); else { data.reports.push(report); st.done = report; }
      st.dirty = false;
      if (typeof P.onDraft === 'function') P.onDraft(null);
      render();
      window.scrollTo(0, 0);
      if (typeof P.onSubmit === 'function') P.onSubmit(st.done);
    }

    function act(name, id) {
      var k;
      if (name === 'ovr' || name === 'altfuel' || name === 'choose' || name === 'add' || name === 'del' || name === 'delphoto') st.dirty = true;
      if (name === 'hints') { st.hints = !st.hints; if (typeof P.onHints === 'function') P.onHints(st.hints); render(); }
      else if (name === 'back') { document.body.style.overflow = ''; if (typeof P.onExit === 'function') P.onExit(); }
      else if (name === 'remark') { st.remarkOpen = !st.remarkOpen; render(); }
      else if (name === 'pick') { st.sheet = { key: id, q: '' }; render(); }
      else if (name === 'close') { st.sheet = null; render(); }
      else if (name === 'ovr') { st.f.odoOverride = !st.f.odoOverride; st.f.odoStart = ''; render(); }
      else if (name === 'altfuel') { st.f.altFuel = !st.f.altFuel; render(); }
      else if (name === 'choose') { k = st.sheet.key; setVal(k, id); structural(k); st.sheet = null; render(); }
      else if (name === 'add') { st.refills.push({ id: ++uid, type: '', target: '', liters: '', fuelTypeId: '', odo: '', full: '', sum: '', photo: null }); render(); }
      else if (name === 'del') { st.refills = st.refills.filter(function (r) { return r.id !== Number(id); }); render(); }
      else if (name === 'submit') submit();
      else if (name === 'send') send();
      else if (name === 'unask') { st.ask = false; render(); }
      else if (name === 'unfail') { st.fail = false; render(); }
      else if (name === 'showerr') showErr(true);
      else if (name === 'new') { st.tried = false; st.done = null; st.dirty = false; st.touched = {}; st.shown = {}; st.f = blank(); st.refills = []; render(); window.scrollTo(0, 0); }
      else if (name === 'delphoto') { k = refillById(id); if (k) k.photo = null; render(); }
    }

    el.addEventListener('input', function (ev) {
      var t = ev.target, k = t.getAttribute('data-f');
      if (t.getAttribute('data-q') && st.sheet) { st.sheet.q = t.value; setOut('picklist', pickList()); return; }   // поиск: обновляем только список
      if (!k || t.type === 'radio' || t.tagName === 'SELECT') return;
      if (t.classList.contains('num')) groupInput(t, t.getAttribute('inputmode') === 'decimal', ev);
      setVal(k, t.value);
      st.editing = k;
      st.dirty = true;
      refresh();
    });
    // Ввод закончен: поле покинули. Теперь его можно проверять.
    el.addEventListener('focusout', function (ev) {
      var t = ev.target, k = t.getAttribute && t.getAttribute('data-f');
      if (!k || !isText(t)) return;
      st.touched[k] = true;
      if (st.editing === k) st.editing = null;
      refresh();
    });
    // «Готово» на клавиатуре телефона или Enter — то же, что покинуть поле: клавиатура прячется, поле проверяется.
    el.addEventListener('keydown', function (ev) {
      var t = ev.target;
      if (ev.key === 'Enter' && t.tagName === 'INPUT' && t.classList.contains('gdr-in')) { ev.preventDefault(); t.blur(); }
    });
    el.addEventListener('change', function (ev) {
      var t = ev.target, k = t.getAttribute('data-f'), r, file;
      if (t.getAttribute('data-photo')) {
        r = refillById(t.getAttribute('data-photo')); file = t.files && t.files[0];
        if (r && file) { try { r.photo = URL.createObjectURL(file); } catch (x) { r.photo = null; } st.dirty = true; render(); }
        return;
      }
      if (!k) return;
      st.dirty = true;
      setVal(k, t.value);
      if (t.type === 'radio' || t.tagName === 'SELECT') { structural(k); render(); } else refresh();
    });
    el.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-act]');
      if (b) act(b.getAttribute('data-act'), b.getAttribute('data-id'));
    });

    init(params);
    render();
    return {
      get state() { return st; },
      update: function (p) { init(Object.assign({}, P, p)); render(); }
    };
  }
};

/* ===================== 4. ПРОСМОТР ОТЧЁТА =====================
   GipReportView.mount(el, params) — отчёт без правки.
   params: report, data, hints, onBack(), onFix(report), onHints(flag) */

var HC = {   // пояснения к экранам кабинета
  acc: 'Где показать, кто вошёл, и как выйти, предлагает разработчик: блок внизу списка, как здесь, или нажатие на имя водителя в шапке с отдельным экраном. Требования: водитель видит, под каким аккаунтом вошёл; выйти случайно нельзя; незаконченный отчёт при выходе остаётся на телефоне и виден только своему водителю. Вход — через Google, только для допущенных (ТЗ-013).',
  login: 'Экран входа здесь — имитация, настоящий вход описан в ТЗ-013.',
  top: '<b>Первый экран кабинета.</b> Уведомлений в системе нет: о возврате водитель узнаёт, когда откроет кабинет. Поэтому возвращённые отчёты стоят первыми. Список обновляется сам — при каждом открытии кабинета и при возврате в него из другого приложения; отдельной кнопки нет, страницу можно обновить обычным жестом браузера.',
  ret: 'Возвращённые отчёты показываются всегда, независимо от периода (ТЗ-007, п. 3.8). Замечание офиса обязательно и видно целиком (п. 3.4).',
  draft: 'Незаконченный отчёт хранится на телефоне и в систему не попадает (ТЗ-007, п. 3.2). Он один: пока он есть, вместо «Новий звіт» предлагается его продолжить.',
  list: 'Свои отчёты за период из настройки, сейчас 30 дней. В строке главное — маршрут, под ним дата, машина и пробег; номер отчёта мелко, он нужен, только чтобы назвать отчёт офису. Состояние — значком и словом. Изменить можно только отчёт на исправлении. Отчёт, который офис пометил на удаление, остаётся в списке приглушённым, с пометкой (ТЗ-007, п. 3.10).',
  view: 'Просмотр без правки: отправленный и подтверждённый отчёт водитель изменить не может (решение собственника 07.08). Кнопка «Виправити» есть только у отчёта, который вернул офис.'
};

var GipReportView = {
  mount: function (el, P) {
    var r = P.report, hints = !!P.hints;
    function render() {
      var h = topbar(esc(r.routeName), fmtDate(r.date) + ' · ' + esc(r.vehicleName), { back: true, hints: hints });
      if (r.deleted) {
        h += '<div class="gdr-row"><p><b>Позначено на видалення.</b> Офіс вважає цей звіт зайвим — наприклад, це дубль. Робити з ним нічого не потрібно.</p></div>';
      }
      if (r.state === 'returned' && !r.deleted) {
        h += '<div class="gdr-row ret">' + remarkHtml(r) + '<div class="gdr-rowb"><button type="button" class="gdr-btn primary" data-act="fix">Виправити</button></div></div>';
      }
      h += '<div class="gdr-card">' + kv('Стан', badge(r)) + reportDetails(r, P.data) + '</div><div class="gdr-note">' + HC.view + '</div>';
      el.className = 'gdr' + (hints ? ' hints' : '');
      el.innerHTML = h;
    }
    el.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-act]'), a = b && b.getAttribute('data-act');
      if (a === 'back') P.onBack();
      else if (a === 'fix') P.onFix(r);
      else if (a === 'hints') { hints = !hints; if (typeof P.onHints === 'function') P.onHints(hints); render(); }
    });
    render();
  }
};

/* ===================== 5. КАБИНЕТ ВОДИТЕЛЯ =====================
   GipDriverCabinet.mount(el, params) — первый экран: возвращённые отчёты, незаконченный отчёт, свои отчёты за период.
   Остальные экраны он вызывает сам — форму (новый отчёт, продолжение, исправление) и просмотр, — а те возвращаются в него.

   params (все необязательны):
     today, data, hints — как у формы
     vehicle   id машины для нового отчёта, если форма открывается сразу
     screen    с какого экрана начать: 'list' (по умолчанию), 'form', 'fix', 'view'
     report    номер отчёта для 'fix' и 'view' */

var GipDriverCabinet = {
  mount: function (el, params) {
    var P = Object.assign({}, params);
    var today = /^\d{4}-\d{2}-\d{2}$/.test(P.today || '') ? P.today : isoDate(new Date());
    var data = P.data || testData(today), hints = !!P.hints, drafts = {};

    // Незаконченные отчёты живут на телефоне: в памяти страницы и, если браузер позволяет, в его хранилище —
    // тогда они переживают перезагрузку. Фото в хранилище не кладётся.
    try { drafts = JSON.parse(window.localStorage.getItem('gip-dr-drafts') || '{}') || {}; } catch (x) { drafts = {}; }
    function setDraft(key, s) {
      if (s) drafts[key] = s; else delete drafts[key];
      try { window.localStorage.setItem('gip-dr-drafts', JSON.stringify(drafts, function (k, v) { return k === 'photo' ? null : v; })); } catch (x) { /* хранилища нет — живёт до перезагрузки */ }
    }
    function byNum(n) { return data.reports.filter(function (r) { return r.number === n; })[0] || null; }
    // Каждый экран получает новый контейнер: обработчики прежнего экрана уходят вместе с ним.
    function fresh() {
      var box = document.createElement('div');
      el.innerHTML = ''; el.appendChild(box);
      document.body.style.overflow = ''; window.scrollTo(0, 0);
      return box;
    }

    function openForm(report) {
      var key = report ? 'fix:' + report.number : 'new';
      GipDriverReport.mount(fresh(), { today: today, data: data, hints: hints, report: report || null, draft: drafts[key] || null,
        vehicle: report ? '' : (P.vehicle || ''), offline: !!P.offline,
        onDraft: function (s) { setDraft(key, s); }, onHints: function (v) { hints = v; }, onExit: openList });
      P.vehicle = '';
    }
    function openView(report) {
      GipReportView.mount(fresh(), { report: report, data: data, hints: hints, onBack: openList, onFix: openForm, onHints: function (v) { hints = v; } });
    }
    function rowHead(r) {
      // Водитель узнаёт рейс по маршруту, дате и машине. Номер отчёта нужен, чтобы назвать его офису, — он мелко, справа под состоянием.
      return '<b><span>' + esc(r.routeName) + '</span>' + badge(r) + '</b>' +
        (r.routeDesc ? '<small class="gdr-desc">' + esc(r.routeDesc) + '</small>' : '') +
        '<span class="gdr-l2"><small class="gdr-meta">' + shortDay(r.date, today) + ' · ' + esc(r.vehicleName) + ' · ' + nf(r.mileage, 0, 0) + ' км</small>' +
        '<small class="gdr-num">№ ' + r.number + '</small></span>';
    }

    function openList() {
      var box = fresh(), since = shift(today, -data.settings.historyDays), dr = drafts['new'], dv = dr && byId(data.vehicles, dr.f.vehicleId), h;
      var mine = data.reports.filter(function (r) { return r.mine; }).sort(function (a, b) { return (a.date + a.number) < (b.date + b.number) ? 1 : -1; });
      var ret = mine.filter(function (r) { return r.state === 'returned' && !r.deleted; });
      var rest = mine.filter(function (r) { return ret.indexOf(r) < 0 && r.date >= since; });

      h = topbar('Мої звіти', esc(data.driver.name), { hints: hints }) + '<div class="gdr-note">' + HC.top + '</div>';
      if (ret.length) {
        h += '<div class="gdr-sec bad">На виправленні: ' + ret.length + '</div>';
        ret.forEach(function (r) {
          h += '<div class="gdr-row ret">' + rowHead(r) + remarkHtml(r) + (drafts['fix:' + r.number] ? '<small>Є незавершені правки на цьому телефоні</small>' : '') +
            '<div class="gdr-rowb"><button type="button" class="gdr-btn primary" data-act="fix" data-id="' + r.number + '">Виправити</button></div></div>';
        });
        h += '<div class="gdr-note">' + HC.ret + '</div>';
      }
      if (dr) {
        h += '<div class="gdr-sec">Незавершений звіт</div><div class="gdr-row draft"><b><span>' + shortDay(dr.f.date, today) + (dv ? ' · ' + esc(dv.name) : '') + '</span></b>' +
          (dr.failed ? '<small class="gdr-fail">Не відправлено: не було зв\'язку. Відкрийте й відправте ще раз.</small>'
            : '<small>Ще не відправлений. Зберігається на цьому телефоні.</small>') +
          '<div class="gdr-2 gdr-rowb"><button type="button" class="gdr-btn primary" data-act="new">Продовжити</button>' +
          '<button type="button" class="gdr-btn" data-act="dropdraft">Видалити</button></div></div>';
      } else {
        h += '<div class="gdr-actions"><button type="button" class="gdr-btn primary" data-act="new">Новий звіт</button></div>';
      }
      h += '<div class="gdr-note">' + HC.draft + '</div>';
      h += '<div class="gdr-sec">Мої звіти за ' + data.settings.historyDays + ' днів</div>';
      rest.forEach(function (r) { h += '<button type="button" class="gdr-row' + (r.deleted ? ' del' : '') + '" data-act="view" data-id="' + r.number + '">' + rowHead(r) + '</button>'; });
      if (!rest.length) h += '<p class="gdr-empty gdr-pad">Звітів за цей період немає.</p>';
      h += '<div class="gdr-note">' + HC.list + '</div>';
      h += '<div class="gdr-acc"><span>' + esc(data.driver.name) + '<small>' + esc(data.driver.email) + '</small></span>' +
        '<button type="button" class="gdr-btn" data-act="logout">Вийти</button></div><div class="gdr-note">' + HC.acc + '</div>';
      box.className = 'gdr' + (hints ? ' hints' : '');
      box.innerHTML = h;
      box.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-act]'), a = b && b.getAttribute('data-act'), id = b && b.getAttribute('data-id');
        if (a === 'new') openForm(null);
        else if (a === 'fix') openForm(byNum(id));
        else if (a === 'view') openView(byNum(id));
        else if (a === 'dropdraft') { setDraft('new', null); openList(); }
        else if (a === 'hints') { hints = !hints; openList(); }
        else if (a === 'logout') openLogin();
      });
    }
    // Вход — имитация: показывает только, куда водитель попадает после «Вийти».
    function openLogin() {
      var box = fresh();
      box.className = 'gdr' + (hints ? ' hints' : '');
      box.innerHTML = '<div class="gdr-top"><h1>GIP Trans<small>кабінет водія</small></h1></div>' +
        '<div class="gdr-card gdr-done"><div class="big">Ви вийшли</div><p class="gdr-empty">Щоб здати звіт, увійдіть знову.</p></div>' +
        '<div class="gdr-actions"><button type="button" class="gdr-btn primary" data-act="login">Увійти через Google</button></div>' +
        '<div class="gdr-note">' + HC.login + '</div>';
      box.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-act]');
        if (b && b.getAttribute('data-act') === 'login') openList();
      });
    }

    if (P.screen === 'form') openForm(null);
    else if (P.screen === 'fix' && byNum(P.report)) openForm(byNum(P.report));
    else if (P.screen === 'view' && byNum(P.report)) openView(byNum(P.report));
    else openList();
    return { openList: openList, openForm: openForm, openView: openView };
  }
};

/* ===================== 6. ЗАПУСК =====================
   Файл открывается кабинетом водителя. Параметры можно передать в адресе:
     ?hints=1                     сразу с пояснениями
     ?today=2026-10-14            что считать сегодняшним днём
     ?screen=form                 сразу форма нового отчёта; ?vehicle=v1 — с выбранной машиной
     ?screen=fix&report=000122    сразу исправление возвращённого отчёта
     ?screen=view&report=000124   сразу просмотр отчёта
     ?offline=1                   показать отправку без связи: первая попытка не проходит, повторная проходит
     ?embed=1                     одна форма без шапки и без кабинета — для вставки в другой дизайн */

window.GipDriverReport = GipDriverReport;
window.GipReportView = GipReportView;
window.GipDriverCabinet = GipDriverCabinet;
var q = new URLSearchParams(window.location.search), app = document.getElementById('app');
var common = { hints: q.get('hints') === '1', today: q.get('today') || '', vehicle: q.get('vehicle') || '', offline: q.get('offline') === '1' };
if (q.get('embed') === '1') GipDriverReport.mount(app, Object.assign({ embed: true }, common));
else GipDriverCabinet.mount(app, Object.assign({ screen: q.get('screen') || (common.vehicle ? 'form' : 'list'), report: q.get('report') || '' }, common));
})();
</script>
</body>
</html>

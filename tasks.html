<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Статус задач</title>
<style>
  html { color-scheme: light only; }
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --good:           #0ca30c;
    --critical:       #d03b3b;
    --s-not-started:  #2a78d6;
    --s-in-progress:  #eb6834;
    --s-done:         #1baf7a;
    --s-blocked:      #eda100;
    --s-cancelled:    #e87ba4;
  }
  /* Тема зафиксирована на светлой — не зависит от системной темы устройства */

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  header p {
    margin: 0 0 28px;
    color: var(--text-secondary);
    font-size: 14px;
  }

  /* KPI row */
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 2px;
    background: var(--gridline);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .kpi {
    background: var(--surface-1);
    padding: 14px 16px;
  }
  .kpi .label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .kpi .value {
    font-size: 28px;
    font-weight: 600;
    font-variant-numeric: proportional-nums;
  }
  .kpi.good .value { color: var(--good); }
  .kpi.critical .value { color: var(--critical); }

  /* Bar chart */
  .chart {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px 14px;
    margin-bottom: 28px;
  }
  .chart h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 14px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 130px 1fr 44px;
    align-items: center;
    gap: 10px;
    height: 32px;
    cursor: pointer;
    border-radius: 6px;
  }
  .bar-row:hover { background: var(--page-plane); }
  .bar-row .name {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .bar-track {
    background: var(--gridline);
    border-radius: 4px;
    height: 24px;
    position: relative;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px 0 0 4px;
    min-width: 3px;
  }
  .bar-row .count {
    font-size: 13px;
    color: var(--text-primary);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .legend {
    display: none;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .controls span.lbl {
    font-size: 13px;
    color: var(--text-secondary);
    margin-right: 4px;
  }
  .seg {
    display: inline-flex;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
  }
  .seg button {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .seg button.active {
    background: var(--page-plane);
    color: var(--text-primary);
    font-weight: 600;
  }

  /* Groups & table */
  .group {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
  }
  .group-header:hover { background: var(--page-plane); }
  .group-header .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
  }
  .group-header .title {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
  }
  .group-header .n {
    font-size: 12px;
    color: var(--text-muted);
  }
  .group-header .chev {
    color: var(--text-muted);
    transition: transform .15s ease;
    font-size: 11px;
  }
  .group.collapsed .chev { transform: rotate(-90deg); }
  .group.collapsed .rows { display: none; }

  .task-row {
    border-top: 1px solid var(--gridline);
    padding: 10px 16px 10px 36px;
    cursor: pointer;
  }
  .task-row:hover { background: var(--page-plane); }
  .task-row .line1 {
    display: flex;
    gap: 10px;
    align-items: baseline;
  }
  .task-row .id {
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  .task-row .title2 {
    font-size: 13px;
    color: var(--text-primary);
    flex: 1;
  }
  .task-row .owner {
    font-size: 12px;
    color: var(--text-secondary);
    flex: none;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 2px 9px 2px 7px;
    border-radius: 999px;
    background: var(--page-plane);
    border: 1px solid var(--border);
    flex: none;
    white-space: nowrap;
  }
  .status-badge .ic {
    font-weight: 700;
    line-height: 1;
  }
  .task-row .detail {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--gridline);
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .task-row.open .detail { display: block; }
  .task-row .detail b { color: var(--text-primary); font-weight: 600; }

  footer {
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body data-palette="#2a78d6,#eb6834,#1baf7a,#eda100,#e87ba4">
<div class="viz-root wrap">

    <h1>GIP.online — статус задач</h1>

  <div class="controls">
    <span class="lbl">Группировать по:</span>
    <div class="seg" id="groupSeg">
      <button data-group="status" class="active">Статусу</button>
      <button data-group="owner">Ответственному</button>
      <button data-group="none">Без группировки</button>

  <div id="groups"></div>

  cancelled:   { label: "Отменено",      color: "var(--s-cancelled)",   icon: "⊘" },
};
function statusBadge(status) {
  const m = STATUS_META[status];
  return `<span class="status-badge"><span class="ic" style="color:${m.color}">${m.icon}</span>${m.label}</span>`;
}
const STATUS_ORDER = ["not_started", "in_progress", "done", "blocked", "cancelled"];

{id:"ORG-008",title:"Зарегистрироваться у хостинг-провайдера (Hetzner Cloud; план Б — DigitalOcean/Vultr)",source:"gip-deployment-plan.md",source_date:"2026-07-17",owner:"PO",planned_date:"",status:"not_started",status_date:"2026-07-17",notes:""},

document.getElementById("updated").textContent = "Снимок реестра орг-задач на 2026-07-26 · " + TASKS.length + " задач";

// ---- KPI row ----
const counts = {};
STATUS_ORDER.forEach(s => counts[s] = 0);
TASKS.forEach(t => counts[t.status] = (counts[t.status]||0) + 1);

const kpiDefs = [
  { label: "Всего задач", value: TASKS.length, cls: "" },
  { label: "Готово", value: counts.done, cls: "good" },
  { label: "В работе", value: counts.in_progress, cls: "" },
  { label: "Заблокировано", value: counts.blocked, cls: "critical" },
  { label: "Не начато", value: counts.not_started, cls: "" },
];
document.getElementById("kpis").innerHTML = kpiDefs.map(k =>
  `<div class="kpi ${k.cls}"><div class="label">${k.label}</div><div class="value">${k.value}</div></div>`
).join("");

// ---- Bar chart (status breakdown, categorical, clickable -> filters groups) ----
const maxCount = Math.max(...STATUS_ORDER.map(s => counts[s]), 1);
const barChartEl = document.getElementById("barChart");
barChartEl.innerHTML = STATUS_ORDER.map(s => {
  const meta = STATUS_META[s];
  const pct = Math.round((counts[s] / maxCount) * 100);
  return `<div class="bar-row" data-status="${s}">
    <div class="name">${meta.label}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${meta.color}"></div></div>
    <div class="count">${counts[s]}</div>
  </div>`;
}).join("");

// ---- Grouping + rows ----
let currentGroup = "status";
let activeFilter = null; // status key when filtered from chart click

function renderGroups() {
  const groupsEl = document.getElementById("groups");
  let filtered = activeFilter ? TASKS.filter(t => t.status === activeFilter) : TASKS;

  let buckets = [];
  if (currentGroup === "status") {
    buckets = STATUS_ORDER
      .map(s => ({ key: s, label: STATUS_META[s].label, color: STATUS_META[s].color, items: filtered.filter(t => t.status === s) }))
      .filter(b => b.items.length);
  } else if (currentGroup === "owner") {
    const owners = [...new Set(filtered.map(t => t.owner))].sort();
    buckets = owners.map(o => ({ key: o, label: o, color: "var(--text-muted)", items: filtered.filter(t => t.owner === o) }));
  } else {
    buckets = [{ key: "all", label: "Все задачи", color: "var(--text-muted)", items: filtered }];
  }

  groupsEl.innerHTML = buckets.map(b => `
    <div class="group${activeFilter ? "" : " collapsed"}" data-key="${b.key}">
      <div class="group-header">
        <span class="dot" style="background:${b.color}"></span>
        <span class="title">${b.label}</span>
        <span class="n">${b.items.length}</span>
        <span class="chev">&#9660;</span>
      </div>
      <div class="rows">
        ${b.items.map(t => `
          <div class="task-row" data-id="${t.id}">
            <div class="line1">
              <span class="id">${t.id}</span>
              ${statusBadge(t.status)}
              <span class="title2">${t.title}</span>
              <span class="owner">${t.owner}</span>
            </div>
            <div class="detail">
              <b>Источник:</b> ${t.source} (${t.source_date})<br>
              <b>Статус с:</b> ${t.status_date}${t.planned_date ? `<br><b>Плановый срок:</b> ${t.planned_date}` : ""}
              ${t.notes ? `<br><b>Заметки:</b> ${t.notes}` : ""}
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");

  groupsEl.querySelectorAll(".group-header").forEach(h => {
    h.addEventListener("click", () => h.closest(".group").classList.toggle("collapsed"));
  });
  groupsEl.querySelectorAll(".task-row").forEach(r => {
    r.addEventListener("click", (e) => { r.classList.toggle("open"); });
  });
}

document.getElementById("groupSeg").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#groupSeg button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentGroup = btn.dataset.group;
  renderGroups();
});

barChartEl.addEventListener("click", (e) => {
  const row = e.target.closest(".bar-row");
  if (!row) return;
  const status = row.dataset.status;
  activeFilter = (activeFilter === status) ? null : status;
  document.querySelector('#groupSeg button[data-group="status"]').click();
});

renderGroups();
</script>
</body>
</html>

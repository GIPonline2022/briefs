<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Звіти водіїв</title>
<!--
  Прототип к ТЗ-005 «Журнал отчётов водителя». Один файл, без сборки и без внешних зависимостей:
  открывается с диска, из мессенджера или по ссылке. Данные тестовые и живут в памяти страницы,
  после перезагрузки всё возвращается к исходному. Запоминается только период журнала — в браузере,
  у каждого пользователя свой (ТЗ-014, п. 3.6).

  Интерфейс для компьютера. Три компонента: рамка приложения с меню и стартовой страницей (GipOfficeApp),
  журнал отчётов (GipReportJournal) и карточка отчёта (GipOfficeReport). Рамка открывает журнал, журнал —
  карточку, карточка возвращается в журнал. Каждый компонент получает контейнер и параметры;
  параметры описаны в комментарии перед ним.

  Тестовые машины, маршруты и виды топлива — те же, что в прототипе ТЗ-004, плюс две машины для журнала:
  выбывшая из парка и давно стоящая.
-->
<style>
:root {
  color-scheme: light only;
  --y: #FFD400; --y-press: #E6BF00; --y-soft: #FFF6BF; --y-edge: #C9A800;
  --k: #111111; --bg: #F3F3F0; --card: #FFFFFF; --text: #111111; --muted: #5F5F5A; --line: #CFCFC9;
  --err: #C62828; --err-bg: #FDECEC; --note: #F0F0EC; --warn: #7A4D00; --warn-bg: #FFEFC2; --ok: #1E6B31; --ok-bg: #E3F2E6;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
button, input, select, textarea { font: inherit; color: var(--text); }

/* рамка: шапка, меню слева, рабочая область */
.go-app { min-height: 100vh; display: grid; grid-template-columns: 230px minmax(0, 1fr); grid-template-rows: auto 1fr; }
.go-top { grid-column: 1 / -1; position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 20px; background: var(--k); color: #FFFFFF; }
.go-brand { color: var(--y); font-size: 18px; font-weight: 700; }
.go-mbtn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; margin-left: -8px; padding: 0; border: 1.5px solid transparent; border-radius: 10px; background: none; color: #FFFFFF; cursor: pointer; }
.go-mbtn:hover { border-color: #5F5F5A; }
.go-mbtn svg { width: 22px; height: 22px; }
/* в шапке — что открыто и его главные параметры: у журнала период, у документа номер и дата; как в 1С (рамка, ядро) */
.go-ctx { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; min-width: 0; padding-left: 14px; border-left: 1px solid #3A3A36; }
.go-ctx:empty { display: none; }
.go-ctx-title { color: #FFFFFF; font-size: 18px; font-weight: 700; }
.go-ctx-title small { color: #BDBDB5; font-size: 15px; font-weight: 400; }
.go-ctx-period { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 4px 12px; border: 1.5px solid #5F5F5A; border-radius: 10px; background: none; color: var(--y); font-weight: 700; cursor: pointer; }
.go-ctx-period small { color: #D8D8D2; font-size: 13px; font-weight: 400; }
.go-ctx-period svg { width: 18px; height: 18px; }
.go-ctx-help { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1.5px solid #5F5F5A; border-radius: 999px; background: none; color: #FFFFFF; cursor: pointer; }
.go-ctx-help svg { width: 22px; height: 22px; }
.go-ctx-period:hover, .go-ctx-help:hover { border-color: var(--y); }
.go-acc { position: relative; margin-left: auto; }
.go-accbtn { display: block; min-height: 40px; padding: 4px 10px; border: 1.5px solid transparent; border-radius: 10px; background: none; color: #FFFFFF; font-size: 14px; text-align: right; cursor: pointer; }
.go-accbtn small { display: block; color: #BDBDB5; font-size: 12px; }
.go-accbtn:hover, .go-acc.open .go-accbtn { border-color: #5F5F5A; }
.go-accpop { display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: 300px; max-width: calc(100vw - 32px); padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
.go-acc.open .go-accpop { display: block; }
.go-accpop b { display: block; font-size: 16px; }
.go-accpop small { display: block; color: var(--muted); }
.go-accpop .go-btn { width: 100%; margin-top: 12px; }
.go-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.go-login .go-card { width: 100%; max-width: 380px; text-align: center; }
.go-login .go-brand { display: block; margin: 0 0 6px; color: var(--k); }
.go-role { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #BDBDB5; }
.go-role select { min-height: 36px; padding: 4px 8px; border-radius: 8px; border: 1.5px solid var(--y); background: var(--k); color: var(--y); }
.go-hbtn { min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--y); background: var(--k); color: var(--y); font-weight: 600; cursor: pointer; }
.go-hbtn.on { background: var(--y); color: var(--k); }
.go-menu { background: var(--card); border-right: 1px solid var(--line); padding: 8px 0 24px; }
.go-menu .go-mgrp { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; margin: 10px 0 2px; padding: 6px 16px 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.go-menu .go-mgrp:hover { color: var(--text); }
.go-mgrp i { font-style: normal; font-size: 14px; }
.go-menu .go-mgrp.here { border-left-color: var(--y); background: var(--y-soft); color: var(--text); }
.go-mitems.shut { display: none; }
.go-menu .go-note { margin: 16px 12px; }
.go-app.nomenu { grid-template-columns: minmax(0, 1fr); }
.go-app.nomenu .go-menu { display: none; }
.go-app.nomenu .go-selbar { left: 0; }
.go-menu button { display: block; width: 100%; min-height: 40px; padding: 8px 16px; border: 0; border-left: 4px solid transparent; background: none; text-align: left; cursor: pointer; }
.go-menu button:hover { background: var(--note); }
.go-menu button.on { border-left-color: var(--y); background: var(--y-soft); font-weight: 700; }
.go-main { min-width: 0; padding: 18px 24px 96px; }
.go-h1 { margin: 0 0 12px; font-size: 24px; }
.go-start { min-height: 60vh; }

/* пояснения — для собственника и разработчика, сотрудник офиса их не видит */
.go-note { display: none; margin: 8px 0 12px; padding: 8px 12px; border-left: 4px solid var(--y-edge); background: var(--note); color: var(--muted); font-size: 14px; }
.hints .go-note { display: block; }
.go-note b { color: var(--text); }

/* кнопки */
.go-btn { min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--k); background: var(--card); font-weight: 600; cursor: pointer; }
.go-btn:hover { background: var(--note); }
.go-btn.primary { background: var(--y); border-color: var(--y-edge); }
.go-btn.primary:hover { background: var(--y-press); }
.go-btn.warn { color: var(--err); border-color: var(--err); }
.go-btn[disabled] { opacity: .45; cursor: default; }
.go-link { border: 0; background: none; padding: 4px 0; color: var(--k); font-weight: 600; text-decoration: underline; cursor: pointer; }

/* журнал: строка инструментов, вкладки, таблица */
.go-search { display: flex; align-items: center; gap: 6px; }
.go-in { min-height: 40px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: #FFFFFF; }
.go-in:focus, .go-ibtn:focus, .go-btn:focus, .go-tab:focus, .go-ctx button:focus, .go-mbtn:focus, .go-menu button:focus { outline: 3px solid var(--y); outline-offset: 1px; }
.go-in.bad { border-color: var(--err); background: var(--err-bg); }
/* окна поверх журнала: период, фильтры, колонки (ТЗ-014, п. 3.11) */
.go-dlgbg { position: fixed; inset: 0; z-index: 36; background: rgba(0, 0, 0, .35); }
.go-pop { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 37; width: 420px; max-width: calc(100vw - 32px); max-height: calc(100vh - 110px); overflow-y: auto; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 8px 24px rgba(0, 0, 0, .15); }
.go-pop > b:first-child { display: block; margin: 0 0 10px; font-size: 17px; }
.go-fpop .go-filters { flex-direction: column; align-items: stretch; margin: 0; }
.go-fpop label.go-flt { align-items: stretch; margin: 0; }
.go-fpop .go-flt select { max-width: none; width: 100%; }
.go-colpop ol { margin: 8px 0; padding-left: 22px; }
.go-colpop li { display: flex; align-items: center; gap: 6px; min-height: 38px; }
.go-colpop li span { flex: 1; }
.go-colpop li small { color: var(--muted); }
.go-colpop li .go-btn { min-height: 34px; min-width: 38px; padding: 2px 8px; }
.go-table tr.go-sub td.sub { padding-left: 42px; }
.go-pop label { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 40px; margin: 0 0 6px; cursor: pointer; }
.go-pop input[type=number] { width: 72px; }
.go-pop .go-row { display: flex; gap: 8px; margin-top: 10px; }
.go-perr { color: var(--err); font-size: 13px; min-height: 18px; }
.go-table tbody tr.nolink { cursor: default; }
.go-actf { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; color: var(--muted); }
.go-chip { min-height: 36px; padding: 4px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--card); cursor: pointer; }
.go-chip.on { border-color: var(--k); background: var(--k); color: var(--y); font-weight: 700; }
.go-sort { padding: 0; border: 0; background: none; color: inherit; font: inherit; font-weight: 600; white-space: nowrap; cursor: pointer; }
.go-sort:hover, .go-table th.sorted .go-sort { color: var(--text); }
.go-found { margin: 0 0 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.go-found small { color: var(--muted); }
.go-helpbg { position: fixed; inset: 0; z-index: 34; background: rgba(0, 0, 0, .3); }
.go-help { position: fixed; top: 0; right: 0; bottom: 0; z-index: 35; width: 460px; max-width: 100vw; overflow-y: auto; padding: 18px 20px 32px; background: var(--card); box-shadow: -8px 0 24px rgba(0, 0, 0, .2); }
.go-helptop { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.go-help h2 { margin: 0; font-size: 20px; }
.go-help h3 { margin: 18px 0 6px; font-size: 16px; }
.go-help ul, .go-help ol { margin: 0; padding-left: 20px; }
.go-help li { margin: 4px 0; }
.go-hsearch { width: 100%; margin: 12px 0 0; }
.go-help mark { padding: 0 1px; border-radius: 3px; background: var(--y); color: var(--k); }
.go-filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 10px; margin: 0 0 10px; }
.go-flt { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
.go-flt select { min-width: 170px; max-width: 240px; }
.go-flt.on span { color: var(--text); font-weight: 700; }
.go-flt.on select { background: var(--y-soft); border-color: var(--y-edge); font-weight: 700; }
/* строка вкладок: вкладки слева, инструменты значками справа — отдельной строки инструментов нет (ТЗ-014, п. 3.11) */
.go-bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 0 0 12px; }
.go-bar .go-found { margin: 0; padding: 8px 0; }
.go-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.go-ibar { display: flex; align-items: center; gap: 6px; margin-left: auto; padding: 0 0 6px; }
.go-ibtn { position: relative; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); cursor: pointer; }
.go-ibtn:hover { background: var(--note); }
.go-ibtn.on { background: var(--y-soft); border-color: var(--y-edge); }
.go-ibtn[disabled] { opacity: .4; cursor: default; }
.go-ibtn svg { width: 20px; height: 20px; }
.go-ibtn .cnt { position: absolute; top: -8px; right: -8px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--k); color: var(--y); font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }
.go-swrap { position: relative; }
.go-spop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 37; width: 300px; max-width: calc(100vw - 32px); padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 8px 24px rgba(0, 0, 0, .15); }
.go-spop small { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; }
.go-sfield { position: relative; }
.go-sfield svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
.go-sfield input { width: 100%; padding-left: 34px; }
.go-tab { min-height: 42px; padding: 8px 12px; border: 0; border-bottom: 4px solid transparent; background: none; cursor: pointer; font-weight: 600; color: var(--muted); }
.go-tab b { display: inline-block; min-width: 22px; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--note); color: var(--text); font-size: 13px; text-align: center; }
.go-tab.on { border-bottom-color: var(--y); color: var(--text); }
.go-tab.on b { background: var(--k); color: var(--y); }
.go-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.go-table { width: 100%; min-width: 980px; border-collapse: collapse; }
.go-table th { position: sticky; top: 0; padding: 9px 8px; border-bottom: 1px solid var(--line); background: var(--note); color: var(--muted); font-size: 13px; font-weight: 600; text-align: left; white-space: nowrap; }
.go-table td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.go-table tbody:last-of-type tr:last-child td { border-bottom: 0; }
.go-table tbody.go-rep tr { cursor: pointer; }
.go-table tbody.go-rep:hover td { background: #FAFAF7; }
.go-table tbody.sel td { background: var(--y-soft); }
.go-table tbody.del td { color: var(--muted); }
.go-table tr.has-sub td { border-bottom: 0; padding-bottom: 2px; }
.go-table tr.go-sub td { padding-top: 0; }
.go-table .doc { width: 38px; text-align: center; line-height: 1; }
.doc-ic { width: 18px; height: 22px; vertical-align: middle; }
.doc-1 { color: var(--muted); }
.doc-2 { color: var(--ok); }
.doc-3 { color: var(--err); }
.go-table .num { text-align: right; white-space: nowrap; }
.go-table td small { display: block; color: var(--muted); font-size: 13px; }
.go-table .chk { width: 40px; text-align: center; }
.go-table .chk input { width: 20px; height: 20px; cursor: pointer; }
.go-empty { padding: 24px; color: var(--muted); text-align: center; }

/* состояние — всегда значком и словом; позначки — тоже */
.go-st { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.st-submitted { background: var(--note); color: var(--text); }
.st-returned { background: var(--err-bg); color: var(--err); }
.st-approved { background: var(--ok-bg); color: var(--ok); }
.st-posted { background: var(--k); color: var(--y); }
.st-deleted { background: var(--note); color: var(--muted); }
.go-flag { display: inline-block; margin: 0 4px 4px 0; padding: 1px 7px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font-size: 12px; font-weight: 700; white-space: nowrap; }
.go-flag.over { background: var(--err-bg); color: var(--err); }
.go-flag.under { background: #E3EDFB; color: #1D4F91; }
.go-attn p.over { color: var(--err); }
.go-attn p.under { color: #1D4F91; }

/* полоса действий над выделенными — внизу экрана */
.go-selbar { position: fixed; left: 230px; right: 0; bottom: 0; z-index: 18; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 24px; background: var(--k); color: #FFFFFF; }
.go-selbar b { color: var(--y); }
.go-selbar .go-btn { border-color: var(--y); }

/* карточка отчёта */
.go-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
.go-nav .go-navst { margin-left: 6px; }
.go-cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.go-card { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin: 0 0 16px; }
.go-card h2 { margin: 0 0 8px; font-size: 17px; }
.go-kv { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-top: 1px solid var(--line); }
.go-kv:first-of-type { border-top: 0; }
.go-kv > span:first-child { color: var(--muted); }
.go-kv > span:last-child { font-weight: 600; text-align: right; }
.go-kv small { display: block; color: var(--muted); font-weight: 400; }
.go-tip { cursor: help; }
.go-tip i { font-style: normal; color: var(--muted); font-size: 13px; }
.go-attn { margin: 0 0 16px; padding: 10px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--text); }
.go-attn h2 { margin: 0 0 6px; font-size: 16px; color: var(--warn); }
.go-attn p { margin: 4px 0; }
.go-acts .go-btn { display: block; width: 100%; margin: 0 0 8px; }
.go-hist p { margin: 6px 0; }
.go-hist small { color: var(--muted); }
.go-remark { margin: 0 0 16px; padding: 10px 14px; border-radius: 12px; background: var(--err-bg); border-left: 4px solid var(--err); }
.go-refill { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.go-refill:first-of-type { border-top: 0; }
.go-refill .go-rtext { flex: 1; }
.go-refill .go-rtext small { display: block; color: var(--muted); }
.go-thumb { flex: 0 0 auto; width: 64px; height: 90px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: #FFFFFF; cursor: zoom-in; }
.go-thumb svg { width: 100%; height: 100%; display: block; }
.go-thumb.wide { width: 110px; height: 78px; }

/* окна */
.go-modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .55); }
.go-dlg { width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 18px; border-radius: 14px; background: var(--card); }
.go-dlg h2 { margin: 0 0 10px; font-size: 19px; }
.go-dlg textarea { width: 100%; min-height: 110px; resize: vertical; }
.go-dlg .go-row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
.go-dlg .big { width: 100%; max-width: 360px; display: block; margin: 0 auto; }
/* своя подсказка при наведении вместо браузерного title (ТЗ-014, п. 3.7) */
.go-tipbox { position: fixed; z-index: 60; width: max-content; max-width: min(340px, calc(100vw - 16px)); padding: 7px 10px; border-radius: 8px; background: var(--k); color: #FFFFFF; font-size: 13px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .12s; }
.go-tipbox.on { opacity: 1; visibility: visible; }
.go-toast { position: fixed; left: 50%; bottom: 76px; z-index: 50; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 10px; background: var(--k); color: #FFFFFF; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }

/* компьютер: меню и рабочая область прокручиваются отдельно, шапка всегда на месте (рамка, ядро) */
@media (min-width: 761px) {
  .go-app { height: 100vh; grid-template-rows: auto minmax(0, 1fr); }
  .go-menu, .go-main { overflow-y: auto; }
}

/* узкий экран: меню полосой сверху, колонки карточки друг под другом */
@media (max-width: 760px) {
  .go-app { grid-template-columns: minmax(0, 1fr); }
  .go-menu { display: flex; gap: 4px; overflow-x: auto; padding: 4px 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .go-menu .go-mgrp, .go-menu .go-note { display: none; }
  .go-mitems, .go-mitems.shut { display: contents; }
  .go-menu button { width: auto; white-space: nowrap; border-left: 0; border-bottom: 4px solid transparent; }

/* ===================== 2. ОБЩЕЕ ===================== */

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nf(n, min, max) { return Number(n).toLocaleString('uk-UA', { minimumFractionDigits: min || 0, maximumFractionDigits: max == null ? 0 : max }); }

function byId(list, id) { return list.filter(function (x) { return x.id === id; })[0] || null; }

}
function days(a, b) { var x = a.split('-').map(Number), y = b.split('-').map(Number); return Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 864e5); }

function plural(n, one, few, many) { var a = n % 10, b = n % 100; return (a === 1 && b !== 11) ? one : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? few : many; }
function signed(d) { return (d > 0 ? '+' : '−') + nf(Math.abs(d)); }

// Топливо машины — основное первым; строка одна — она основная без отметки (ТЗ-011, п. 3.3).
function fuelsOf(v) {
  var rows = (v && v.fuel) || [];
  return rows.length < 2 ? rows.slice() : rows.filter(function (x) { return x.main; }).concat(rows.filter(function (x) { return !x.main; }));
}
// Топливо рейса (ТЗ-004, п. 3.7): одно — оно; второе вместо основного — основное или второе; вместе — оба.
function tripFuels(v, alt) {
  var f = fuelsOf(v);
  if (!f.length) return [];
  if (f[1] && v.fuelSecondMode === 'together') return [f[0], f[1]];
  return [(f[1] && v.fuelSecondMode === 'instead' && alt) ? f[1] : f[0]];

function mkReport(d, r) {
  var v = byId(d.vehicles, r.vehicleId), tr = byId(d.vehicles, r.trailerId), a, b, rt;
  r.driverName = byId(d.drivers, r.driverId).name;
  r.vehicleName = v.name;
  r.trailerName = tr ? tr.name : (v.kind === 'tractor' ? 'без причепа' : '');
  r.routeName = byId(d.routes, r.routeId).name;
  r.routeDesc = r.routeDesc || ''; r.comment = r.comment || '';
  // заказчик, план и допуск копируются из маршрута при отправке (ТЗ-004, п. 3.3): правка маршрута сданного отчёта не меняет
  rt = byId(d.routes, r.routeId);

// Предыдущий отчёт по машине — по тому же правилу, что в форме водителя (ТЗ-004, п. 3.4).
function prevOf(data, r) {
  var key = r.date + r.number;

// kind — аларм: перепробег (over) и недопробег (under) разного вида; стоят первыми (собственник, 2026-10-14).
function flagsOf(r, data) {
  var out = [], v = byId(data.vehicles, r.vehicleId), p = prevOf(data, r), d = devOf(r), own, main;
  if (d != null) {

      text: '<b>' + (d > 0 ? 'Перепробіг' : 'Недопробіг') + '</b>: фактичний пробіг ' + nf(r.mileage) + ' км, плановий за маршрутом ' + nf(r.planned) +
        ' км, допуск ±' + nf(r.tolerance) + ' км — ' + (d > 0 ? 'більше' : 'менше') + ' на ' + nf(Math.abs(d)) + ' км.' });

  }

      ', цей починається з ' + nf(r.odoStart) + ' (' + signed(d) + ' км). Попередній звіт змінили вже після того, як здали цей.' });
  }

  if (own.length) {
    out.push({ icon: '₴', short: own.some(function (x) { return x.type === 'cash'; }) ? 'готівка' : 'банк. картка',
      text: '<b>Оплачено не паливною карткою</b>: ' + own.map(function (x) { return TYPE[x.type] + ' ' + nf(x.liters, 0, 2) + ' л' + (x.sum ? ', ' + nf(x.sum, 2, 2) + ' грн' : ''); }).join('; ') + '. Фото чеків — у заправках.' });
  }
  if (r.altFuel) {
    main = fuelsOf(v)[0];
    out.push({ icon: '⛽', short: 'інше пальне', text: '<b>Рейс на іншому пальному</b>: ' + esc(fuelName(data, r.fuelTypeId)) + ' замість основного' + (main ? ' (' + esc(low(fuelName(data, main.fuelTypeId))) + ')' : '') + '.' });
  }

    out.push({ icon: '∅', short: 'немає норми', text: '<b>Немає норми</b>: у машини в довіднику ' + (fuelsOf(v).length ? 'не задана норма' : 'не задане пальне') +
      ', розрахункової витрати немає. Задайте її в довіднику машин, щоб наступні звіти її мали.' });

// Подсказка при наведении — одна фраза; подробности в памятке журнала (ТЗ-014, п. 3.7).
var STATE_HINT = { submitted: 'Водій здав звіт, він чекає перевірки', returned: 'Офіс повернув звіт із зауваженням, водій виправляє', approved: 'Офіс перевірив звіт' };
function plain(html) { return String(html).replace(/<[^>]+>/g, ''); }

// вставлять «с пропусками»). Из отчёта — первые шесть колонок и «Топливо литры» формулой; что заполняет бухгалтер или считают её

var SHEET = {
  fop: { name: 'ФОП', blanks: 10 },          // колонки между «Топливо литры» и новыми в конце: их заполняет бухгалтер или считают её формулы
  cash: { name: '«Наличка»', blanks: 7 }     // у «Налички» их на три меньше
};
// Числа — с запятой и без пробелов, отрицательные — с обычным минусом: иначе таблица прочтёт их как текст.
// Формула и числа — под украинские настройки таблицы: десятичная запятая, «;» между аргументами.
function sheetNum(n) { return n == null ? '' : String(n).replace('.', ','); }
function sheetText(s) { return String(s == null ? '' : s).replace(/[\t\r\n]+/g, ' ').trim(); }
function sheetRow(r, data, kind) {
  var dev = devOf(r), blanks = [], i;
  for (i = 0; i < SHEET[kind].blanks; i++) blanks.push('');
  return [fmtDate(r.date),
    r.vehicleName + (r.trailerId ? '/' + r.trailerName : ''),   // «Авто»: машина, с прицепом — «машина/прицеп»
    r.routeDesc || r.routeName,                                  // «Маршрут»: у «Інше» — описание водителя
    r.driverName,
    r.customerName,                                              // заказчик — в таблице это колонка «Догруз»
    r.mileage,
    // «Топливо литры» — формулой, а не числом: бухгалтер видит норму, и норма 0 бросается в глаза (PO, 2026-10-14).
    // В какую строку вставят, неизвестно, поэтому формула берёт пробег своей же строки. Нормы нет — пусто.
    r.norm == null ? '' : '=INDEX(F:F;ROW())/100*' + sheetNum(r.norm)]
    .concat(blanks)
    .concat([r.number, dev == null ? '' : String(dev), dev == null ? '' : (dev > 0 ? 'перепробіг' : 'недопробіг')])
    .map(sheetText).join('\t');
}

// Копирование в буфер обмена. Не вышло (старый браузер, файл с диска) — окно с текстом, который копируют вручную.
function copyText(text, done, fail) {
  var ta;
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, function () { legacy(); }); return; }
  legacy();
  function legacy() {
    ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { if (document.execCommand('copy')) { done(); } else { fail(); } } catch (x) { fail(); }
    document.body.removeChild(ta);
  }
}

// Подсказка при наведении — своим компонентом, а не браузерным title: на Mac у собственника title не показался (ТЗ-014, п. 3.7).
// Текст — из title элемента: при наведении он переезжает в data-tip, чтобы браузер не показывал свою подсказку поверх.
// Мышь — через треть секунды; клавиатура — сразу при переходе Tab.
function tips() {
  var box = document.createElement('div'), timer = null, cur = null;
  box.className = 'go-tipbox'; box.setAttribute('role', 'tooltip'); document.body.appendChild(box);
  function hide() { clearTimeout(timer); cur = null; box.classList.remove('on'); }
  function show(t) {
    var r = t.getBoundingClientRect(), x, y;
    box.textContent = t.getAttribute('data-tip');
    box.classList.add('on');
    x = Math.max(8, Math.min(r.left + r.width / 2 - box.offsetWidth / 2, window.innerWidth - box.offsetWidth - 8));
    y = r.bottom + 8;
    if (y + box.offsetHeight > window.innerHeight - 8) y = Math.max(8, r.top - box.offsetHeight - 8);
    box.style.left = x + 'px'; box.style.top = y + 'px';
  }
  function target(n) {
    var t = n && n.closest ? n.closest('[title], [data-tip]') : null;
    if (t && t.hasAttribute('title')) { if (t.getAttribute('title')) t.setAttribute('data-tip', t.getAttribute('title')); t.removeAttribute('title'); }
    return t && t.getAttribute('data-tip') ? t : null;
  }
  document.addEventListener('mouseover', function (ev) {
    var t = target(ev.target);
    if (t === cur) return;
    hide();
    if (!t) return;
    cur = t;
    timer = setTimeout(function () { if (cur === t && document.body.contains(t)) show(t); }, 300);
  });
  document.addEventListener('focusin', function (ev) {
    var t = target(ev.target), kb = false;
    hide();
    try { kb = ev.target.matches(':focus-visible'); } catch (x) { /* старый браузер */ }
    if (t && kb) { cur = t; show(t); }
  });
  document.addEventListener('focusout', hide);
  document.addEventListener('mousedown', hide, true);
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') hide(); });
  window.addEventListener('scroll', hide, true);
}

  tabs: '<b>Вкладки — по следующему шагу.</b> «Перевірити» — отправленные, старые сверху, в последней колонке — сколько ждёт. «У водія» — возвращённые. «Перенести в таблицю» — подтверждённые, но не проведённые. «Проведені» — перенесённые в таблицу бухгалтерии. «Усі» — все документы периода, включая помеченные на удаление (PO, 2026-10-14); в рабочих вкладках помеченных нет: с ними ничего не делают. Галочек выбора на «Усі» нет — действий над несколькими отчётами здесь нет. Первой открывается вкладка, где у сотрудника есть работа: диспетчеру — «Перевірити», бухгалтеру — «Перенести в таблицю».',
  sort: '<b>Сортировка</b> — нажатие на заголовок колонки: по возрастанию, ещё раз — по убыванию, третий раз — обычный порядок вкладки (ТЗ-014, п. 3.8). Обычный порядок задаёт ТЗ вида: «Перевірити» — кто дольше ждёт, выше; «Без звіту» — вчера сверху, машины по алфавиту; остальные — свежие сверху. Пустые значения всегда внизу. Не запоминается, как фильтры: другая вкладка или журнал из меню — обычный порядок, из карточки обратно — на месте. «Позначки» не сортируются: в строке их может быть несколько. <b>Порядок колонок</b> по умолчанию — состояние документа, дата, номер, дальше колонки вида; это общее правило журналов документов (ТЗ-014, п. 3.10). Значок колонок справа от вкладок открывает окно: в нём меняется порядок любых колонок, включая первые три, и скрывает любые, кроме состояния документа; всё запоминается в браузере у каждого пользователя, как период; «Звичайний вигляд» возвращает исходный порядок и скрытые колонки. Галочки выделения — служебная колонка, всегда слева.',
  flags: '<b>Первая колонка</b> — состояние документа, общее для всех журналов, как в 1С: лист — записан, лист с зелёной галочкой — проведён, лист с красным крестом — помечен на удаление; лист, а не квадратик и не карандаш (ТЗ-014, п. 3.9). Рабочее состояние отчёта — отправлен, на исправлении, подтверждён — отдельной колонкой «Стан» (ТЗ-007). Фильтруются оба. <b>Позначки</b> — второй строкой под отчётом, а не колонкой: так таблица уже (PO, 2026-10-14). Что стоит проверить, всегда значком и словом. Первыми — аларм: пробег отличается от планового по маршруту больше допуска, перепробег красным, недопробег синим (собственник, 2026-10-14; ТЗ-003, п. 3.2); ровно на допуск и у маршрута без плана — без аларма. Дальше: водитель заменил спидометр на начало (ТЗ-004, п. 3.4); разрыв с предыдущим отчётом по машине — тот исправили уже после этого; оплата не топливной картой (п. 3.6); рейс не на основном топливе (п. 3.7); нет нормы.',
  select: '<b>Отметки строк</b> есть на вкладках «Перенести в таблицю» — скопировать для таблицы и провести разом — и «Проведені» — скопировать ещё раз. На других вкладках действий над несколькими отчётами нет — и отметок нет (ТЗ-014, п. 3.5). Подтверждать разом нельзя: каждый отчёт проверяют глазами. Каждый отчёт проводится отдельно, итог показывает, что не проведено и почему.',
  copy: '<b>Копирование в таблицы бухгалтерии.</b> Таблиц две — ФОП и «Наличка» (образец прислан 2026-10-14, ORG-061); колонки идут в одном порядке, но у «Налички» их на три меньше, ширина разная — поэтому кнопок две (PO, 2026-10-14). Какой отчёт в какую таблицу, решает сотрудник: система этого не знает. Копируются только подтверждённые отчёты, у сотрудника с правом проводить (собственник, встреча 07.08): не проведённые — на вкладке «Перенести в таблицю», проведённые — на «Проведені» и в карточке, с предупреждением о дублях. Строка ложится на всю ширину таблицы: дата, авто (с прицепом — «машина/прицеп»), маршрут (у «Інше» — описание водителя), водитель, заказчик — в таблице это колонка «Догруз», пробег; «Топливо литры» — формулой: пробег своей строки ÷ 100 × норма, чтобы бухгалтер видел норму, а норма 0 бросалась в глаза (PO, 2026-10-14); нормы нет — пусто. Колонки, которые заполняет бухгалтер или считают её формулы, пустые. В конце — три новые колонки: № отчёта, отклонение пробега от плана, км, и его статус; отклонение и статус — только если пробег вышел за допуск. Существующие колонки собственник не переставляет, новые добавляет в конец (2026-10-14). Google-таблица не вставляет «с пропусками»: пустая ячейка затирает формулу. Поэтому порядок работы бухгалтера такой: вставить в таблице новые пустые строки, вставить скопированное, протянуть формулы — он же в памятке. Формула и числа — под украинские настройки таблицы: десятичная запятая, «;» между аргументами. Фактических заправок в таблицах нет — они остаются в системе. У машины на двух видах топлива — норма основного топлива рейса.',
  card: '<b>Карточка отчёта</b>: всё, что сдал водитель, и что проверить. Отчёт не правит никто, кроме водителя, и только на исправлении (ТЗ-007): у офиса здесь только действия с состоянием. Набор кнопок зависит от состояния отчёта и прав сотрудника. Под именем водителя и номером машины — ссылки «усі звіти»: журнал открывается с этим фильтром на вкладке «Усі». Фото спидометра на конец рейса — если водитель его приложил: оно необязательно (собственник, 2026-10-14; ТЗ-004).',
  acts: 'Скопіювати для ФОП и для «Наличка» — у подтверждённого отчёта, по кнопке на каждую таблицу бухгалтерии; у проведённого — с предупреждением о дублях. Провести — только подтверждённый и не проведённый. Підтвердити — отчёт проверен; отчёт на исправлении — только после вопроса: водитель, возможно, как раз его правит, и после подтверждения отправить правку уже не сможет. Повернути водієві — с обязательным замечанием, водитель увидит его у себя (ТЗ-007, п. 3.4). Провести — отчёт перенесён в таблицу бухгалтерии руками; проведённый не меняет никто, пока проведение не отменят (п. 3.9). Скасувати підтвердження — по праву подтверждать, скасувати повернення — по праву возвращать (п. 3.3). Пометить на удаление нельзя отчёт на исправлении и проведённый (п. 3.10).',
  hist: 'Что система помнит о движении отчёта — только последнее событие каждого вида (ТЗ-007, п. 3.5). «Проведено» отдельно не хранится: проведённый отчёт не меняется, значит проведение — его последняя запись, и кто и когда провёл, дают общие реквизиты «Автор последний» и «Изменён» (ТЗ-009, п. 3.3.1).',
  next: '«Наступний» — следующий отчёт той же вкладки: очередь проверяют, не возвращаясь в журнал.',
  help: '<b>Шапка — что открыто</b>: название открытого объекта и его главные параметры — у журнала период, у документа номер и дата; как в 1С. Общее правило рамки приложения (PO, 2026-10-14): отдельной строки заголовка в рабочей области нет — экономим место. То же название — в заголовке вкладки браузера. <b>Инструменты журнала — значками</b> справа от вкладок, в одну строку с ними: поиск по номеру, фильтры (на значке — число включённых), колонки (значок подсвечен, если вид изменён); выбор периода, фильтров и колонок — в окне поверх журнала (ТЗ-014, п. 3.11). <b>«?» в шапке</b> — памятка для сотрудников офиса, она есть у каждого журнала (ТЗ-014, п. 3.7). Текст пишет ТЗ вида — для этого журнала ТЗ-005 — и он идёт через словарь, на обоих языках. Вверху памятки — поиск: остаются пункты со всеми словами запроса, совпадения подсвечены; совпал заголовок раздела — раздел целиком. Подсказка при наведении — своим компонентом, а не браузерным title (на Mac у собственника title не показался); в прототипе она уже своя. Одной фразой — что это и что произойдёт: на вкладках, состояниях, пометках, кнопках действий, периоде, поиске, фильтрах, заголовках колонок и подписях карточки со значком ⓘ. Цель — чтобы за объяснением не приходилось лезть в памятку (PO, 2026-10-14). Не путать с «Пояснення»: они для собственника и разработчика и в продукт не попадают.',
  acc: '<b>Кто вошёл и выход</b> — часть рамки приложения (ядро), одинаковы во всех разделах. «Вийти» спрятан в меню под именем, чтобы не нажать случайно. Выход завершает сессию в этом браузере — и в мобильной версии тоже: сессия одна на весь домен (ТЗ-008, п. 3.15). Запомненный период остаётся в браузере у этого пользователя. Вход — через Google, только для допущенных (ТЗ-013).',
  menu: '<b>Меню</b> прячется значком ☰ слева в шапке — больше места для журнала; группы сворачиваются щелчком по названию. Что спрятано и что свёрнуто, запоминается в браузере у каждого пользователя, как период. Свёрнутая группа, в которой открытый раздел, подсвечена — чтобы не потерять, где находишься. Меню и рабочая область прокручиваются отдельно, шапка всегда на месте (PO, 2026-10-14). На телефоне меню — полосой сверху, прокрутка обычная. В react-admin кнопка, прячущая меню, и отдельная прокрутка меню есть из коробки; сворачиваемые группы — небольшой свой компонент.',
  login: 'Экран входа — имитация, настоящий вход описан в ТЗ-013. В прототипе «Увійти» возвращает того же сотрудника на стартовую страницу.'
};

/* ===================== 3. ЖУРНАЛ =====================
   GipReportJournal.mount(el, params) — журнал «Звіти водіїв».

   params:
     data, today   тестовые данные и что считать сегодняшним днём
     role          'dispatcher' | 'accountant' | 'chief' — чьи права
     user          кто вошёл: под этим именем запоминается период
     state         { tab, q, sel } — с чем вернуться из карточки
     ctx           место в шапке приложения: журнал кладёт туда своё название, период и «?»
     onOpen        function (number, list, state) — открыть карточку; list — номера текущего списка по порядку
     toast         function (text) */

var TABS = [
  { id: 'check', title: 'Перевірити', hint: 'Відправлені звіти, які ще не перевірили. Угорі — ті, що чекають найдовше', test: function (r) { return !r.deleted && r.state === 'submitted'; } },
  // не документы, а машины без отчёта (п. «Без звіту» ниже) — отбор у неё свой
  { id: 'missing', title: 'Без звіту', hint: 'Машини без звіту за дні, за які його ще можна здати. Зателефонуйте водієві сьогодні', test: function () { return false; } },
  { id: 'driver', title: 'У водія', hint: 'Повернуті на виправлення: хід за водієм', test: function (r) { return !r.deleted && r.state === 'returned'; } },
  { id: 'transfer', title: 'Перенести в таблицю', hint: 'Підтверджені звіти, яких ще немає в таблиці бухгалтерії. Тут їх копіюють і проводять', test: function (r) { return !r.deleted && r.state === 'approved' && !r.posted; } },
  { id: 'posted', title: 'Проведені', hint: 'Звіти, перенесені в таблицю бухгалтерії. Якщо рядок загубився, тут його можна скопіювати ще раз', test: function (r) { return !!r.posted; } },
  { id: 'all', title: 'Усі', hint: 'Усе за період, разом зі звітами, позначеними на видалення', test: function () { return true; } }
];

  ['Стани звіту', '<p>Перша колонка — стан документа: чистий аркуш — записаний, аркуш із зеленою галочкою — проведений, тобто перенесений у таблицю бухгалтерії, аркуш із червоним хрестиком — позначений на видалення. Колонка «Стан» — стан самого звіту:</p>' +

  ['Позначки: що перевірити', '<ul><li>▲ <b>перепробіг</b> — пробіг більший за плановий по маршруту більше ніж на допуск. Перевірте спідометр і рейс.</li>' +

  ['Дії зі звітом', '<ul><li>Звіт відкривається натисканням на рядок. «Наступний» відкриває наступний звіт тієї самої вкладки.</li>' +

    '<li><b>Позначити на видалення</b> — для дубля або звіту про рейс, якого не було. Позначку можна зняти — тоді зі звітом знову можна працювати.</li>' +

  ['Період, фільтри, пошук, сортування', '<ul><li>Період обмежує все: вкладки, лічильники й пошук. Звіту немає в списку — перевірте період.</li>' +

    // «Без звіту»: пары «машина × день» — действующие машины, кроме прицепов, без неудалённого отчёта за дни, за которые отчёт
    // ещё можно сдать (ТЗ-007, п. 3.11), внутри периода. Сегодня не считается — день не закончился. Фильтры шапки — как везде.
    function windowDays() { var out = [], i; for (i = data.settings.backdateDays; i >= 1; i--) out.push(shift(today, -i)); return out; }
    function missingRows() {
      var x = range(period), out = [];

          var row;
          if (!v.inService || v.kind === 'trailer' || !active(v.id, d)) return;

    // ездит и сейчас — стоявшие машины отсекаются (предложение PO 2026-10-14).
    function active(vid, d) {
      if (st.act === 'all') return true;

    // Фильтры шапки — на всех вкладках: строка проходит, только если у неё есть это значение. У строки «Без звіту» есть машина
    // и водитель последнего отчёта; маршрута и того, кто подтвердил или вернул, у несданного отчёта нет.
    function mpasses(row) {

    function waitText(from) { var n = days(from, today); return n <= 0 ? 'сьогодні' : n + ' ' + plural(n, 'день', 'дні', 'днів'); }
    function rowHtml(r) {
      var f = flagsOf(r, data), cols = docCols();

    function helpHtml() {

        '<div data-hbody="1">' + helpBody(hq) + '</div></aside>';
    }
    // Поиск по памятке (ТЗ-014, п. 3.7): остаются пункты, где есть все слова запроса, совпадения подсвечены.
    // Совпал заголовок раздела — раздел виден целиком. Регистр и вид апострофа не важны.
    function helpBody(q) {
      var box = document.createElement('div'), words = norm(q).split(/\s+/).filter(Boolean), shown = 0, re;
      function has(t) { t = norm(t); return words.every(function (x) { return t.indexOf(x) >= 0; }); }
      box.innerHTML = '<p>Наведіть мишу на кнопку, значок, вкладку, стан, позначку, заголовок стовпця чи підпис зі значком ⓘ — з’явиться коротка підказка.</p>' +
        HELP.map(function (x) { return '<section><h3>' + x[0] + '</h3>' + x[1] + '</section>'; }).join('');
      if (!words.length) return box.innerHTML;
      // номера шагов сохраняются, даже если часть шагов скрыта
      [].slice.call(box.querySelectorAll('ol')).forEach(function (ol) { [].slice.call(ol.children).forEach(function (li, i) { li.value = i + 1; }); });
      re = new RegExp('(' + words.map(function (x) { return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/’/g, "['’ʼ`]"); }).join('|') + ')', 'gi');
      [].slice.call(box.children).forEach(function (sec) {
        var h3 = sec.querySelector('h3'), any = false;
        if (h3 && has(h3.textContent)) { shown++; markText(sec, re); return; }
        (h3 ? [].slice.call(sec.querySelectorAll('li, p')) : [sec]).forEach(function (it) {
          if (has(it.textContent)) { any = true; shown++; markText(it, re); } else it.remove();
        });

    }

      var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT), list = [], n;

    function copySel(kind) {

      function go() {

    }
    // Провести выделенные: каждый отчёт отдельно, итог — что проведено и что нет и почему (ТЗ-014, п. 3.4).
    function postSel() {
      var list = selected();
      P.modal('<h2>Провести ' + list.length + ' ' + plural(list.length, 'звіт', 'звіти', 'звітів') + '?</h2><p>Проведення означає, що звіт перенесено в таблицю бухгалтерії. Проведений звіт ніхто не змінить, поки проведення не скасують.</p>',
        [['Так, провести', 'ok', 'primary'], ['Ні', 'close']], function () {
          var ok = 0, bad = [];
          list.forEach(function (r) {
            var why = r.deleted ? 'позначено на видалення' : (r.posted ? 'уже проведений' : (r.state !== 'approved' ? 'не підтверджений' : ''));
            if (why) bad.push(r.number + ' — ' + why); else { r.posted = true; r.postedBy = P.user; r.postedAt = today; ok++; }
          });
          st.sel = {}; render();
          if (bad.length) P.modal('<h2>Проведено: ' + ok + '</h2><p>Не проведено:</p><p>' + bad.map(esc).join('<br>') + '</p>', [['Зрозуміло', 'close', 'primary']]);
          else P.toast('Проведено звітів: ' + ok);
        });
    }

    el.addEventListener('click', function (ev) {
      var t = ev.target, b = t.closest('[data-act]'), a = b && b.getAttribute('data-act'), id = b && b.getAttribute('data-id'), list;
      if (t.getAttribute('data-sel')) { if (t.checked) st.sel[t.getAttribute('data-sel')] = 1; else delete st.sel[t.getAttribute('data-sel')]; render(); return; }
      if (t.getAttribute('data-selall')) { st.sel = {}; if (t.checked) rows().forEach(function (r) { st.sel[r.number] = 1; }); render(); return; }
      if (t.closest('.chk')) return;   // промах мимо галочки не открывает отчёт
      if (pop && !t.closest('[data-pop]') && a !== 'period') { pop = null; render(); return; }
      if (cpop && !t.closest('[data-cpop]') && a !== 'cols') { cpop = false; render(); return; }

      if (a === 'search') { spop = !spop; pop = null; cpop = false; st.fopen = false; render(); return; }
      if (a === 'cols') { cpop = !cpop; pop = null; st.fopen = false; render(); return; }
      if (a === 'colup' || a === 'coldown') { moveCol(id, a === 'colup' ? -1 : 1); render(); return; }
      if (a === 'colreset') { order = COL_DEFAULT.slice(); hidden = []; saveOrder(); render(); return; }
      if (a === 'cclose') { cpop = false; render(); return; }
      if (a === 'open') { list = el._list; P.onOpen(id, list, { tab: st.tab, q: st.q, sel: st.sel, f: st.f, fopen: st.fopen, sort: st.sort, act: st.act }); }

      else if (a === 'sort') {

        if (!st.sort || st.sort.col !== id) st.sort = { col: id, dir: 1 };
        else if (st.sort.dir === 1) st.sort = { col: id, dir: -1 };
        else st.sort = null;
        render();
      }
      else if (a === 'help') { help = true; render(); }
      else if (a === 'helpclose') { help = false; hq = ''; render(); }
      else if (a === 'ftoggle') { st.fopen = !st.fopen; pop = null; cpop = false; render(); }
      else if (a === 'freset') { st.f = noFilters(); st.sel = {}; render(); }
      else if (a === 'tab') { st.tab = id; st.sel = {}; st.sort = null; render(); }
      else if (a === 'period') { pop = pop ? null : Object.assign({}, period); render(); }
      else if (a === 'pclose') { pop = null; render(); }
      else if (a === 'papply') applyPeriod();
      else if (a === 'clearq') { st.q = ''; st.sel = {}; render(); }
      else if (a === 'unsel') { st.sel = {}; render(); }
      else if (a === 'copy') copySel(id);

      var c = ev.target.getAttribute && ev.target.getAttribute('data-colshow');
      if (c) {

        if (ev.target.checked) hidden = hidden.filter(function (x) { return x !== c; }); else if (hidden.indexOf(c) < 0) hidden.push(c);

    });

    document.addEventListener('keydown', function onKey(ev) {
      if (!document.body.contains(el)) { document.removeEventListener('keydown', onKey); return; }
      if (ev.key === 'Escape' && (help || pop || cpop || st.fopen || spop)) { help = false; hq = ''; pop = null; cpop = false; st.fopen = false; spop = false; render(); }
    });
    // Шапка — вне журнала: период и «?» ловит свой обработчик. Шапка перерисовывается вместе с рамкой и уносит его с собой.
    if (P.ctx) P.ctx.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-act]'), a = b && b.getAttribute('data-act');
      if (a === 'period') { pop = pop ? null : Object.assign({}, period); cpop = false; st.fopen = false; spop = false; render(); }
      else if (a === 'help') { help = true; render(); }
    });
    el.addEventListener('input', function (ev) {
      var t = ev.target;
      // Поиск по памятке: меняется только её текст, поле поиска не теряет фокус.
      if (t.getAttribute('data-hq')) { hq = t.value; el.querySelector('[data-hbody]').innerHTML = helpBody(hq); return; }
      // Поле номера очистили — поиск снят, снова вкладки.
      if (t.getAttribute('data-q') && !t.value && st.q) { st.q = ''; st.sel = {}; render(); }
    });
    // выбор варианта периода по клику в поле числа или даты
    el.addEventListener('focusin', function (ev) {
      var t = ev.target, lab = t.closest && t.closest('.go-pop label'), r = lab && lab.querySelector('input[name=pk]');
      if (r && t !== r) r.checked = true;
    });

    render();
    return { render: render };
  }
};

/* ===================== 4. КАРТОЧКА ОТЧЁТА =====================
   GipOfficeReport.mount(el, params) — отчёт глазами офиса: что сдал водитель, что проверить, действия.

   params:
     data, today, role, user

var GipOfficeReport = {
  mount: function (el, P) {

  post: 'Позначити звіт перенесеним у таблицю бухгалтерії. Після цього його ніхто не змінить, поки проведення не скасують',
  unpost: 'Скасувати проведення: звіт знову можна повернути водієві чи позначити на видалення',

    function actions(r) {

      }
      else if (a === 'odophoto') {
        P.modal('<h2>Фото спідометра на кінець рейсу</h2><div class="big">' + odoSvg(r) + '</div><p class="go-empty" style="padding:8px 0 0">У прототипі спідометр намальований; у системі — знімок, який зробив водій. '
          + 'За звітом на кінець рейсу: ' + nf(r.odoEnd) + '.</p>', [['Закрити', 'close']]);
      }
      else if (a === 'photo') {
        P.modal('<h2>Фото чека</h2><div class="big">' + receiptSvg(r.refills[Number(id)], data) + '</div><p class="go-empty" style="padding:8px 0 0">У прототипі чек намальований; у системі — знімок, який зробив водій.</p>', [['Закрити', 'close']]);
      }
    }
    el.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-act]');
      if (b) act(b.getAttribute('data-act'), b.getAttribute('data-id'));
    });
    render();
  }
};

/* ===================== 5. РАМКА ПРИЛОЖЕНИЯ =====================
   GipOfficeApp.mount(el, params) — шапка, меню, стартовая страница; из меню открывается журнал.

   params (все необязательны):
     today    'ГГГГ-ММ-ДД' — что считать сегодняшним днём; по умолчанию дата устройства
     role     'dispatcher' (по умолчанию) | 'accountant' | 'chief'
     hints    true — показать пояснения
     screen   'start' (по умолчанию) | 'journal' | 'report'
     report   номер отчёта для 'report' */

var GipOfficeApp = {
  mount: function (el, params) {
    var P = Object.assign({}, params);
    var today = /^\d{4}-\d{2}-\d{2}$/.test(P.today || '') ? P.today : isoDate(new Date());
    var data = testData(today), role = ROLES[P.role] ? P.role : 'dispatcher', hints = !!P.hints, page = 'start', jstate = null, list = [], timer, menu;
    // Меню строится из прав и подсистем; здесь — что видит офис в подсистеме «Транспорт».
    var MENU = [
      { id: 'docs', title: 'Документи', items: [['journal', 'Звіти водіїв']] },
      { id: 'refs', title: 'Довідники', items: [['ref:vehicle', 'Машини'], ['ref:route', 'Маршрути'], ['ref:fuel', 'Види пального']] }
    ];
    var REF = { 'ref:vehicle': ['Машини', 'ТЗ-011'], 'ref:route': ['Маршрути', 'ТЗ-003'], 'ref:fuel': ['Види пального', 'ТЗ-012'] };

    function user() { return data.staff[role].name; }
    function toast(text) {
      var n = document.querySelector('.go-toast');
      if (n) n.remove();
      n = document.createElement('div'); n.className = 'go-toast'; n.textContent = text; document.body.appendChild(n);
      clearTimeout(timer); timer = setTimeout(function () { n.remove(); }, 3500);
    }
    // Окно: buttons — [надпись, 'ok' | 'close', класс]; onOk(box) вернул false — окно не закрывается.
    function modal(html, buttons, onOk) {
      var m = document.createElement('div');
      m.className = 'go-modal';
      m.innerHTML = '<div class="go-dlg" role="dialog" aria-modal="true">' + html + '<div class="go-row">' + buttons.map(function (b) {
        return '<button type="button" class="go-btn ' + (b[2] || '') + '" data-m="' + b[1] + '">' + b[0] + '</button>';
      }).join('') + '</div></div>';
      document.body.appendChild(m);
      var f = m.querySelector('textarea, input'); if (f) f.focus();
      m.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-m]');
        if (ev.target === m || (b && b.getAttribute('data-m') === 'close')) { m.remove(); return; }
        if (b && b.getAttribute('data-m') === 'ok') { if (!onOk || onOk(m.querySelector('.go-dlg')) !== false) m.remove(); }
      });
    }

    // Меню: спрятано ли оно и какие группы свёрнуты — в браузере у каждого пользователя, как период (ТЗ-014, п. 3.6).
    function menuKey() { return 'gip-office:menu:' + user(); }
    function loadMenu() {
      try {
        var v = JSON.parse(window.localStorage.getItem(menuKey()) || 'null');
        if (v && Array.isArray(v.shut)) return { hidden: !!v.hidden, shut: v.shut };
      } catch (x) { /* хранилища нет */ }
      return { hidden: false, shut: [] };
    }
    function saveMenu() { try { window.localStorage.setItem(menuKey(), JSON.stringify(menu)); } catch (x) { /* живёт до перезагрузки */ } }
    // Свёрнутая группа, в которой открытый раздел, подсвечена: где находишься, видно и так.
    function paintGroup(b) {
      var box = b.nextElementSibling, shut = menu.shut.indexOf(b.getAttribute('data-id')) >= 0, here = shut && !!box.querySelector('.on');
      box.classList.toggle('shut', shut);
      b.classList.toggle('here', here);
      b.setAttribute('aria-expanded', String(!shut));
      b.querySelector('i').textContent = shut ? '▸' : '▾';
      b.removeAttribute('title');
      b.setAttribute('data-tip', here ? 'Тут відкритий розділ. Натисніть, щоб розгорнути групу' : (shut ? 'Розгорнути групу' : 'Згорнути групу'));
    }
    function paintMenuBtn(b) {
      el.classList.toggle('nomenu', menu.hidden);
      b.setAttribute('aria-expanded', String(!menu.hidden));
      b.removeAttribute('title');
      b.setAttribute('data-tip', menu.hidden ? 'Показати меню' : 'Сховати меню — більше місця для роботи');
    }

    function frame() {
      el.className = 'go-app' + (hints ? ' hints' : '');
      el.innerHTML = '<header class="go-top"><button type="button" class="go-mbtn" data-app="menu" aria-label="Меню">' + ICON.menu + '</button>' +
        '<span class="go-brand">GIP Trans</span><div class="go-ctx" data-ctx="1"></div>' +
        '<label class="go-role">Роль (лише в прототипі): <select data-role="1">' + Object.keys(ROLES).map(function (k) {
          return '<option value="' + k + '"' + (k === role ? ' selected' : '') + '>' + ROLES[k].title + '</option>';
        }).join('') + '</select></label>' +
        // Кто вошёл — в шапке; выход — в меню под именем, чтобы не нажать случайно.
        '<div class="go-acc"><button type="button" class="go-accbtn" data-app="acc" aria-haspopup="true">' + esc(user()) + ' ▾<small>' + ROLES[role].title + '</small></button>' +
        '<div class="go-accpop"><b>' + esc(user()) + '</b><small>' + esc(data.staff[role].email) + '</small><small>' + ROLES[role].title + '</small>' +
        '<button type="button" class="go-btn" data-app="logout">Вийти</button><div class="go-note">' + NOTE.acc + '</div></div></div>' +
        '<button type="button" class="go-hbtn' + (hints ? ' on' : '') + '" data-app="hints">Пояснення</button></header>' +
        '<nav class="go-menu">' + MENU.map(function (g) {
          return '<button type="button" class="go-mgrp" data-app="grp" data-id="' + g.id + '"><span>' + g.title + '</span><i aria-hidden="true"></i></button>' +
            '<div class="go-mitems">' + g.items.map(function (i) {
              return '<button type="button" class="' + (page === i[0] || (i[0] === 'journal' && page === 'report') ? 'on' : '') + '" data-app="go" data-id="' + i[0] + '">' + i[1] + '</button>';
            }).join('') + '</div>';
        }).join('') + '<div class="go-note">' + NOTE.menu + '</div></nav><main class="go-main"><div class="go-note">' + NOTE.role + '</div><div data-main="1"></div></main>';
      [].forEach.call(el.querySelectorAll('.go-mgrp'), paintGroup);
      paintMenuBtn(el.querySelector('.go-mbtn'));
      return el.querySelector('[data-main]');
    }
    // Что открыто — в шапке и в заголовке вкладки браузера: несколько открытых вкладок различимы.
    function ctx(html, name) { el.querySelector('[data-ctx]').innerHTML = html; document.title = name + ' — GIP Trans'; }
    function open(id, number) {
      var box;
      page = id;
      if (id === 'start') {
        box = frame(); box.className = 'go-start'; box.innerHTML = '<div class="go-note">' + NOTE.start + '</div>';
        ctx('<span class="go-ctx-title">Початкова сторінка</span>', 'Початкова сторінка');
        return;
      }
      if (id === 'journal') {
        box = frame(); document.title = 'Звіти водіїв — GIP Trans';
        GipReportJournal.mount(box, { data: data, today: today, role: role, user: user(), state: jstate, toast: toast, modal: modal, ctx: el.querySelector('[data-ctx]'),
          onOpen: function (n, l, s) { jstate = s; list = l; open('report', n); } });
        return;
      }
      if (id === 'report') {
        box = frame(); document.title = 'Звіт водія № ' + number + ' — GIP Trans';
        GipOfficeReport.mount(box, { data: data, today: today, role: role, user: user(), report: number, list: list, toast: toast, modal: modal, ctx: el.querySelector('[data-ctx]'),
          onBack: function () { open('journal'); }, onOpen: function (n) { open('report', n); },
          // «усі звіти водія / машини»: журнал на вкладке «Усі» с этим фильтром
          onFilter: function (f) { jstate = { tab: 'all', q: '', sel: {}, f: Object.assign(noFilters(), f), fopen: false }; open('journal'); } });
        return;
      }
      box = frame();
      ctx('<span class="go-ctx-title">' + REF[id][0] + '</span>', REF[id][0]);
      box.innerHTML = '<p class="go-empty" style="text-align:left;padding:0">У прототипі не показано: довідник описаний у ' + REF[id][1] + '.</p><div class="go-note">' + NOTE.ref + '</div>';
    }
    // Вход — имитация: показывает только, куда сотрудник попадает после «Вийти».
    function openLogin() {
      page = 'login';
      document.title = 'Вхід — GIP Trans';
      el.className = 'go-out' + (hints ? ' hints' : '');
      el.innerHTML = '<div class="go-login"><div class="go-card"><span class="go-brand">GIP Trans</span><h1 class="go-h1">Ви вийшли</h1>' +
        '<p>Щоб працювати далі, увійдіть знову.</p><button type="button" class="go-btn primary" data-app="login">Увійти через Google</button>' +
        '<div class="go-note">' + NOTE.login + '</div></div></div>';
    }
    el.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-app]'), a = b && b.getAttribute('data-app'), acc = el.querySelector('.go-acc'), k;
      if (acc && acc.classList.contains('open') && !ev.target.closest('.go-acc')) acc.classList.remove('open');   // щелчок мимо закрывает меню
      if (!b) return;
      if (a === 'hints') { hints = !hints; el.classList.toggle('hints', hints); b.classList.toggle('on', hints); }
      else if (a === 'menu') { menu.hidden = !menu.hidden; saveMenu(); paintMenuBtn(b); }
      else if (a === 'grp') {
        k = menu.shut.indexOf(b.getAttribute('data-id'));
        if (k >= 0) menu.shut.splice(k, 1); else menu.shut.push(b.getAttribute('data-id'));
        saveMenu(); paintGroup(b);
      }
      else if (a === 'go') { jstate = null; open(b.getAttribute('data-id')); }
      else if (a === 'acc') acc.classList.toggle('open');
      else if (a === 'logout') { jstate = null; openLogin(); }
      else if (a === 'login') open('start');
    });
    el.addEventListener('change', function (ev) {
      if (!ev.target.getAttribute('data-role')) return;
      // Другая роль — другой сотрудник: журнал открывается заново, со своим периодом, своей первой вкладкой и своим видом меню.
      role = ev.target.value; jstate = null; menu = loadMenu();
      open(page === 'report' ? 'journal' : page);
    });

    menu = loadMenu();
    if (P.screen === 'report' && data.reports.some(function (r) { return r.number === P.report; })) {
      list = data.reports.map(function (r) { return r.number; }); open('report', P.report);
    } else open(P.screen === 'journal' ? 'journal' : 'start');
    return { open: open };
  }
};

/* ===================== 6. ЗАПУСК =====================
   Файл открывается стартовой страницей. Параметры в адресе:
     ?hints=1                      сразу с пояснениями
     ?today=2026-10-14             что считать сегодняшним днём
     ?role=accountant              роль: dispatcher, accountant, chief
     ?screen=journal               сразу журнал
     ?screen=report&report=000126  сразу карточка отчёта */

tips();
window.GipOfficeApp = GipOfficeApp;
window.GipReportJournal = GipReportJournal;
window.GipOfficeReport = GipOfficeReport;
var q = new URLSearchParams(window.location.search);
GipOfficeApp.mount(document.getElementById('app'), { hints: q.get('hints') === '1', today: q.get('today') || '', role: q.get('role') || '',
  screen: q.get('screen') || '', report: q.get('report') || '' });
})();
</script>
</body>
